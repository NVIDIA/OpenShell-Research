<text class="subtitle" x="60" y="80">Release-mode, in-process benchmark · 5,000 samples per case after 1,000 warm-up decisions</text>
<text class="metric" x="1140" y="52" text-anchor="end">p95: 1.006–1.250 ms</text>
<text class="label" x="65" y="137">Decision latency (ms)</text>
