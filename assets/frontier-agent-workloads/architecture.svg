<!-- Adapted from openshell-containment-lab/docs/diagrams/customer-architecture.svg. Visible titles and footer captions are in the accompanying Dev Note Markdown. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="665" viewBox="0 65 1280 665" role="img" aria-labelledby="title desc">
<title id="title">Recommended OpenShell deployment for long-running frontier workloads</title><desc id="desc">The trusted control node hosts OpenShell gateway, Policy Advisor, prover, protected provider credentials and supervisor. Operator integrations provide SDK review, a maximum-policy gate, egress inspection and behavior monitoring with trusted stop controls. A separate untrusted sandbox node hosts a disposable VM and agent workload. The recommended external network boundary denies independent internet access. This is a component placement recommendation, not a verified deployment. Administrative channels are omitted and must be secured.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#579000"/></marker>
<style>
.section { font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#475569; letter-spacing:.06em; }
.label { font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#111827; }
.small { font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#475569; }
.tiny { font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#475569; }
.heading { font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#111827; }
.box { fill:#fff; stroke:#cbd5e1; stroke-width:2; }
.soft { fill:#f8fafc; stroke:#cbd5e1; stroke-width:2; }
.green { fill:#f2f9e8; stroke:#76b900; stroke-width:2.5; }
.trusted { fill:#eff6ff; stroke:#3b82f6; stroke-width:2.5; }
.dark { fill:#1f2937; stroke:#111827; stroke-width:2; }
.line { fill:none; stroke:#334155; stroke-width:2.5; marker-end:url(#arrow); }
.flow { fill:none; stroke:#579000; stroke-width:3; marker-end:url(#arrow-green); }
.blocked { fill:none; stroke:#c2413b; stroke-width:2.5; stroke-dasharray:8 7; }
</style></defs>
<rect width="1280" height="840" rx="20" fill="#fff"/>

<rect x="40" y="85" width="760" height="85" rx="14" class="soft" />
<text x="65" y="113" text-anchor="start" class="tiny" >TASK-SCOPED EXTERNAL SERVICES</text>
<text x="65" y="145" text-anchor="start" class="label" >Model endpoint · code repositories · approved data and APIs</text>
<text x="40" y="215" text-anchor="start" class="section" >CONTROL NODE · TRUSTED</text>
<rect x="40" y="235" width="760" height="475" rx="14" class="soft" />
<text x="80" y="269" text-anchor="start" class="tiny" >OPENSHELL</text>
<text x="520" y="269" text-anchor="start" class="tiny" >OPERATOR INTEGRATIONS</text>
<rect x="80" y="285" width="380" height="100" rx="14" class="trusted" />
<text x="270" y="315" text-anchor="middle" class="label" >Gateway</text>
<text x="270" y="341" text-anchor="middle" class="small" >Policy Advisor · policy prover</text>
<text x="270" y="365" text-anchor="middle" class="small" >Provider secrets + protected key storage</text>
<rect x="520" y="285" width="250" height="100" rx="14" class="green" />
<text x="645" y="315" text-anchor="middle" class="label" >SDK review integration</text>
<text x="645" y="341" text-anchor="middle" class="small" >Task judgment</text>
<text x="645" y="365" text-anchor="middle" class="small" >Fixed maximum-policy gate</text>
<rect x="80" y="435" width="380" height="100" rx="14" class="trusted" />
<text x="270" y="466" text-anchor="middle" class="label" >Supervisor</text>
<text x="270" y="493" text-anchor="middle" class="small" >Policy enforcement · credential binding</text>
<text x="270" y="517" text-anchor="middle" class="small" >Opens permitted upstream connections</text>
<rect x="520" y="435" width="250" height="100" rx="14" class="green" />
<text x="645" y="466" text-anchor="middle" class="label" >Egress watchdog</text>
<text x="645" y="493" text-anchor="middle" class="small" >Inspect supported traffic</text>
<text x="645" y="517" text-anchor="middle" class="small" >Apply task-specific limits</text>
<rect x="65" y="615" width="710" height="70" rx="14" class="green" />
<text x="85" y="643" text-anchor="start" class="label" >Agent behavior watchdog</text>
<text x="85" y="669" text-anchor="start" class="small" >Correlate activity · retain evidence · invoke trusted stop controls</text>
<path d="M 270 385 V 435" class="line"/>
<path d="M 520 335 H 460" class="line"/>
<path d="M 460 485 H 520" class="line"/>
<path d="M 80 485 H 25 V 127 H 40" class="flow"/>
<text x="900" y="215" text-anchor="start" class="section" >SANDBOX NODE · UNTRUSTED</text>
<rect x="900" y="235" width="340" height="330" rx="14" class="soft" style="stroke-dasharray:10 7"/>
<rect x="925" y="280" width="290" height="245" rx="14" class="box" />
<text x="1070" y="314" text-anchor="middle" class="tiny" >DISPOSABLE VM</text>
<text x="1070" y="351" text-anchor="middle" class="label" >OpenShell workload</text>
<text x="1070" y="379" text-anchor="middle" class="small" >Tools · task files · scratch space</text>
<rect x="950" y="410" width="240" height="80" rx="14" class="dark" />
<text x="1070" y="442" text-anchor="middle" class="label" style="fill:#fff">Frontier agent</text>
<text x="1070" y="469" text-anchor="middle" class="small" style="fill:#d1d5db">No raw provider secrets</text>
<rect x="925" y="580" width="290" height="105" rx="14" class="green" />
<text x="1070" y="610" text-anchor="middle" class="label" >External network boundary</text>
<text x="1070" y="638" text-anchor="middle" class="small" >No independent internet access</text>
<text x="1070" y="662" text-anchor="middle" class="small" >Enforced outside the sandbox node</text>
<path d="M 925 450 H 850 V 570 H 270 V 535" class="flow"/>
<text x="850" y="397" text-anchor="middle" class="tiny" >MEDIATED</text>
<text x="850" y="415" text-anchor="middle" class="tiny" >TRAFFIC</text>
<path d="M 1215 350 H 1255 V 142" class="blocked"/>
<path d="M 1246 124 L 1264 142 M 1264 124 L 1246 142" stroke="#c2413b" stroke-width="3"/>
<text x="1240" y="110" text-anchor="end" class="tiny" >NO DIRECT EGRESS</text>



</svg>
