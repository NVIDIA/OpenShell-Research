name: Reviewer profiles end to end

"on":
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/reviewer-profiles-e2e.yml
      - .github/actions/setup-review-gateway/**
      - .github/openshell-agents/profiles/ci-reviewer/**
      - .github/scripts/**
      - projects/openshell-agent-runner/**
      - projects/PROJECT_GUIDELINES.md
  push:
    branches: [main]
    paths:
      - .github/workflows/reviewer-profiles-e2e.yml
      - .github/actions/setup-review-gateway/**
      - .github/openshell-agents/profiles/ci-reviewer/**
      - .github/scripts/**
      - projects/openshell-agent-runner/**
      - projects/PROJECT_GUIDELINES.md
  workflow_dispatch:

permissions: {}

concurrency:
  group: reviewer-profiles-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reviewer-e2e:
    name: Exercise the installed OAR wheel and three new-project review tasks
    # This smoke executes candidate OAR code, so only same-repository PRs are
    # trusted. Fork PRs do not run live inference in this iteration.
    if: >-
      (github.event_name == 'pull_request' &&
       !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]') ||
      (github.event_name != 'pull_request' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout the exact tested head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: projects/openshell-agent-runner/uv.lock

      - name: Configure isolated paths
        run: |
          {
            echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/reviewer-e2e-venv"
            echo "RESULTS_DIR=$RUNNER_TEMP/reviewer-results"
            echo "PROFILES_DIR=$RUNNER_TEMP/reviewer-profiles"
            echo "FIXTURES_DIR=$GITHUB_WORKSPACE/projects/openshell-agent-runner/tests/fixtures/reviewer-e2e"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/reviewer-results" "$RUNNER_TEMP/review-context"
          cp projects/PROJECT_GUIDELINES.md "$RUNNER_TEMP/review-context/PROJECT_GUIDELINES.md"

      - name: Build and install the wheel
        id: build
        working-directory: projects/openshell-agent-runner
        run: |
          uv sync --locked --no-install-project
          uv build --no-sources --out-dir "$RUNNER_TEMP/reviewer-wheels"
          wheel=("$RUNNER_TEMP"/reviewer-wheels/*.whl)
          test "${#wheel[@]}" -eq 1
          uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" --no-deps "${wheel[0]}"
          "$UV_PROJECT_ENVIRONMENT/bin/oar" --help

      - name: Validate profiles and preview packaged reviewers
        id: profiles
        env:
          REVIEW_MODEL: ${{ secrets.MODEL_ID_TOP }}
        run: |
          test -n "$REVIEW_MODEL"
          oar="$UV_PROJECT_ENVIRONMENT/bin/oar"
          "$oar" init "$PROFILES_DIR" --model "$REVIEW_MODEL"
          for profile in code-reviewer technical-writing-reviewer; do
            "$oar" validate "$PROFILES_DIR/$profile"
          done
          "$oar" run "$PROFILES_DIR/code-reviewer" --task review-repository \
            --input "$FIXTURES_DIR/repository" --output "$RUNNER_TEMP/code-preview.json" --dry-run
          "$oar" run "$PROFILES_DIR/technical-writing-reviewer" --task review-document \
            --input "$FIXTURES_DIR/technical-document.txt" --output "$RUNNER_TEMP/document-preview.json" --dry-run
          test ! -e "$RUNNER_TEMP/code-preview.json"
          test ! -e "$RUNNER_TEMP/document-preview.json"
          cp -R .github/openshell-agents/profiles/ci-reviewer "$PROFILES_DIR/ci-reviewer"
          jq --arg model "$REVIEW_MODEL" '.providers.openshell.models[0].id = $model' \
            "$PROFILES_DIR/ci-reviewer/models.json" > "$RUNNER_TEMP/models.json"
          mv "$RUNNER_TEMP/models.json" "$PROFILES_DIR/ci-reviewer/models.json"
          jq --arg model "$REVIEW_MODEL" '.defaultModel = $model' \
            "$PROFILES_DIR/ci-reviewer/settings.json" > "$RUNNER_TEMP/settings.json"
          mv "$RUNNER_TEMP/settings.json" "$PROFILES_DIR/ci-reviewer/settings.json"
          "$oar" validate "$PROFILES_DIR/ci-reviewer"
          python3 "$FIXTURES_DIR/repository/checks.py"
          python3 "$FIXTURES_DIR/research-spike/experiment.py"
          python3 "$FIXTURES_DIR/use-case-example/summarize.py"

      - name: Start one ephemeral gateway
        id: gateway
        uses: ./.github/actions/setup-review-gateway
        with:
          api-key: ${{ secrets.INFERENCE_API_KEY }}
          base-url: ${{ secrets.INFERENCE_BASE_URL }}
          model: ${{ secrets.MODEL_ID_TOP }}

      - name: Run all three new-project reviewer tasks
        id: reviews
        run: |
          failed=0
          while IFS= read -r item; do
            id=$(jq -r '.id' <<< "$item")
            task=$(jq -r '.task' <<< "$item")
            input=$(jq -r '.input' <<< "$item")
            if "$UV_PROJECT_ENVIRONMENT/bin/oar" run "$PROFILES_DIR/ci-reviewer" \
              --task "$task" --input "$FIXTURES_DIR/$input" \
              --upload "$FIXTURES_DIR:/workspace" \
              --upload "$RUNNER_TEMP/review-context:/workspace" \
              --prompt-var guidelines_path=/workspace/review-context/PROJECT_GUIDELINES.md \
              --prompt-var 'focus=Review the complete fixture against its explicit purpose and claims.' \
              --prompt-var 'context=This is a small CI fixture, not a production product. Related evidence is in /workspace/reviewer-e2e. Evaluate only its stated scope; do not request production packaging or generalized infrastructure. This is a pipeline check, not a review of the PR.' \
              --gateway openshell --timeout-seconds 600 \
              --output "$RESULTS_DIR/$id.json" > "$RESULTS_DIR/$id.log" 2>&1; then
              echo "$id completed"
            else
              echo "::error::$id did not complete; see its artifact log."
              failed=1
            fi
          done < <(jq -c '.[]' "$FIXTURES_DIR/cases.json")
          exit "$failed"

      - name: Verify every result and rubric total
        id: results
        if: always()
        run: |
          python3 .github/scripts/review_report.py verify \
            --request "$FIXTURES_DIR/cases.json" --results "$RESULTS_DIR"

      - name: Stop the gateway
        id: cleanup
        if: always() && steps.gateway.outcome != 'skipped'
        run: systemctl --user stop openshell-gateway.service

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reviewer-profile-results
          path: ${{ runner.temp }}/reviewer-results
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize the pipeline smoke test
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXECUTION_OUTCOME: ${{ job.status }}
        run: |
          python3 .github/scripts/review_report.py summary --smoke \
            --request "$FIXTURES_DIR/cases.json" --results "$RESULTS_DIR" \
            --outcome "$EXECUTION_OUTCOME" --output "$RESULTS_DIR/report.md"
