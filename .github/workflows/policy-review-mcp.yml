name: Policy review MCP

"on":
  pull_request:
    paths:
      - projects/use-case-examples/policy-review-mcp/**
      - .github/workflows/policy-review-mcp.yml
  push:
    branches: [main]
    paths:
      - projects/use-case-examples/policy-review-mcp/**
      - .github/workflows/policy-review-mcp.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-review-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check policy review MCP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/use-case-examples/policy-review-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Lint and check formatting
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Test without live credentials
        run: uv run --locked pytest -q
