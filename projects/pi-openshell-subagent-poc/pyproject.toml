[project]
name = "openshell-tool-service"
version = "0.1.0"
description = "Minimal Pi subagent launcher backed by OpenShell sandboxes."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "NVIDIA CORPORATION & AFFILIATES" },
]
dependencies = [
    "fastapi>=0.115,<1",
    "httpx[http2]>=0.27,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
openshell-tool-service = "openshell_tool_service.cli:main"
openshell-collaboration-watch = "openshell_tool_service.collaboration_watch:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.uv]
required-version = ">=0.8.0"
