version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  model_provider:
    name: Configured model endpoint
    endpoints:
      - host: api.example.com # prepare replaces this from models.json.
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }

network_middlewares:
  network_redaction:
    name: Redact fake API keys at egress only
    middleware: openshell/regex
    config:
      mode: redact
    on_error: fail_closed
    endpoints:
      include:
        - api.example.com # prepare replaces this from models.json.
