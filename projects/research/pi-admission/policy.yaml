version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /proc
  - /dev/urandom
  - /app
  - /etc
  - /var/log
  read_write:
  - /sandbox
  - /tmp
  - /dev/null
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  model_provider:
    name: Configured model endpoint
    endpoints:
    - host: openrouter.ai
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: POST
          path: /api/v1/chat/completions
    binaries:
    - path: /usr/bin/node
    - path: /usr/local/bin/node
network_middlewares:
  network_redaction:
    name: Redact email addresses at egress
    middleware: pi-marker
    config:
      pattern: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
      replacement: "[EMAIL]"
    on_error: fail_closed
    endpoints:
      include:
      - openrouter.ai
