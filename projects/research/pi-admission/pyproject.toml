[project]
name = "pi-admission-example"
version = "0.1.0"
description = "Setup helpers for the standalone OpenShell Pi admission example."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
  "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
required-version = ">=0.11.0"
