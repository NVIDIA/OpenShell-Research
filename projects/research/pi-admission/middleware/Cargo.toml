[package]
name = "pi-admission"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "Apache-2.0"

[lib]
name = "pi_admission"

[dependencies]
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
bytes = "1"
ed25519-dalek = { version = "2", features = ["pem", "pkcs8", "rand_core"] }
futures-core = "0.3"
jsonwebtoken = "10"
prost = "0.14"
prost-types = "0.14"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"

[build-dependencies]
protobuf-src = "1.1.0"
tonic-prost-build = "0.14"
