<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title description">
  <title id="title">Egress Gate processing pipeline</title>
  <desc id="description">A validated policy and immutable byte-oriented request share one timeout. Ordered gates run and validate their evaluations. Egress Gate applies each patch returned with a proceed result to the current request, then returns a decision, an optional request patch, and findings.</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1f2933}
      .card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
      .control{fill:#fff5eb;stroke:#c86622;stroke-width:2}
      .gate{fill:#f7f1ff;stroke:#8056a8;stroke-width:2}
      .result{fill:#eef9f1;stroke:#2f855a;stroke-width:2.5}
      .number{fill:#3973ad}
      .number-text{font-size:15px;font-weight:700;fill:#fff}
      .title{font-size:20px;font-weight:700}
      .subtitle{font-size:15px;fill:#5f6b76}
      .arrow{fill:none;stroke:#718096;stroke-width:2.5;marker-end:url(#arrow)}
      .arrow-head{fill:#718096}
      .loop{fill:none;stroke:#a0aec0;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .arrow-label{font-size:14px;fill:#5f6b76}
      @media(prefers-color-scheme:dark){
        text{fill:#edf2f7}
        .card{fill:#182126;stroke:#52606d}
        .control{fill:#3a2819;stroke:#f6ad55}
        .gate{fill:#2d203a;stroke:#b794d4}
        .result{fill:#143126;stroke:#68d391}
        .number{fill:#4a89c2}
        .subtitle,.arrow-label{fill:#aeb8c5}
        .arrow{stroke:#8b98a5}
        .arrow-head{fill:#8b98a5}
        .loop{stroke:#71808e}
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" class="arrow-head"/>
    </marker>
  </defs>

  <rect x="40" y="38" width="250" height="96" rx="16" class="card"/>
  <circle cx="72" cy="70" r="17" class="number"/><text x="72" y="76" text-anchor="middle" class="number-text">1</text>
  <text x="105" y="72" class="title">Input</text>
  <text x="72" y="105" class="subtitle">Policy + immutable HTTP request</text>

  <path d="M290 86h66" class="arrow"/>

  <rect x="358" y="38" width="264" height="96" rx="16" class="control"/>
  <circle cx="390" cy="70" r="17" class="number"/><text x="390" y="76" text-anchor="middle" class="number-text">2</text>
  <text x="423" y="72" class="title">Runtime controls</text>
  <text x="390" y="105" class="subtitle">One shared timeout + bounds</text>

  <path d="M622 86h66" class="arrow"/>

  <rect x="690" y="38" width="250" height="96" rx="16" class="gate"/>
  <circle cx="722" cy="70" r="17" class="number"/><text x="722" y="76" text-anchor="middle" class="number-text">3</text>
  <text x="755" y="72" class="title">Evaluate gate</text>
  <text x="722" y="105" class="subtitle">gate.evaluate(current request)</text>

  <path d="M815 134v72" class="arrow"/>

  <rect x="690" y="208" width="250" height="96" rx="16" class="card"/>
  <circle cx="722" cy="240" r="17" class="number"/><text x="722" y="246" text-anchor="middle" class="number-text">4</text>
  <text x="755" y="242" class="title">Validate output</text>
  <text x="722" y="275" class="subtitle">Control · patch · findings · limits</text>

  <path d="M690 256h-66" class="arrow"/>
  <text x="657" y="244" text-anchor="middle" class="arrow-label">validated</text>

  <rect x="358" y="208" width="264" height="96" rx="16" class="gate"/>
  <circle cx="390" cy="240" r="17" class="number"/><text x="390" y="246" text-anchor="middle" class="number-text">5</text>
  <text x="423" y="242" class="title">Apply control</text>
  <text x="390" y="275" class="subtitle">Apply patch or stop</text>

  <path d="M358 256h-66" class="arrow"/>

  <rect x="40" y="208" width="250" height="96" rx="16" class="card"/>
  <circle cx="72" cy="240" r="17" class="number"/><text x="72" y="246" text-anchor="middle" class="number-text">6</text>
  <text x="105" y="242" class="title">Finalize</text>
  <text x="72" y="275" class="subtitle">Findings · provenance · default</text>

  <path d="M165 304v72" class="arrow"/>

  <rect x="40" y="378" width="900" height="140" rx="18" class="result"/>
  <circle cx="78" cy="414" r="17" class="number"/><text x="78" y="420" text-anchor="middle" class="number-text">7</text>
  <text x="111" y="416" class="title">Return the explicit result</text>

  <rect x="86" y="444" width="230" height="48" rx="12" class="card"/>
  <text x="201" y="466" text-anchor="middle" class="title">Decision</text>
  <text x="201" y="485" text-anchor="middle" class="subtitle">allow or deny</text>
  <rect x="375" y="444" width="230" height="48" rx="12" class="card"/>
  <text x="490" y="466" text-anchor="middle" class="title">Request patch</text>
  <text x="490" y="485" text-anchor="middle" class="subtitle">body + headers</text>
  <rect x="664" y="444" width="230" height="48" rx="12" class="card"/>
  <text x="779" y="466" text-anchor="middle" class="title">Findings</text>
  <text x="779" y="485" text-anchor="middle" class="subtitle">bounded + sourced</text>

  <path d="M490 208v-38c0-20 16-36 36-36h164" class="loop"/>
  <text x="548" y="184" class="arrow-label">proceed · next gate</text>
</svg>
