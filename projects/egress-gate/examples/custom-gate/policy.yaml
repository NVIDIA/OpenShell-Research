version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  claude_code:
    name: Claude Code access
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: platform.claude.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: claude.ai
        port: 443
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/bin/node }

network_middlewares:
  egress_gate_fn:
    name: Deny the configured keyword
    middleware: egress-function
    order: 0
    config:
      gates:
        - name: block-secret-keyword
          kind: keyword-deny
          keyword: SECRET
      default_decision: allow
    on_error: fail_closed
    endpoints:
      include:
        - api.anthropic.com
