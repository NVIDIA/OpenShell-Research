version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  model_provider:
    name: Configured model endpoint
    endpoints:
      - host: provider.example.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }

network_middlewares:
  pi_egress_gate:
    name: Admit rendered Pi prompts and inspect provider requests
    middleware: pi-egress
    order: 0
    config:
      gates:
        - name: deny-marker
          kind: regex
          scan:
            kind: body
            action:
              kind: deny
          pattern_catalog:
            entities:
              - name: unsafe-marker
                rules:
                  - name: exact-deny-marker
                    pattern: DENY_THIS
                    confidence: high
        - name: replace-marker
          kind: regex
          scan:
            kind: body
            action:
              kind: replace
              template: "[REDACTED]"
          pattern_catalog:
            entities:
              - name: replacement-marker
                rules:
                  - name: exact-replacement-marker
                    pattern: REDACT_THIS
                    confidence: high
      default_decision: allow
    on_error: fail_closed
    endpoints:
      include:
        - provider.example.com
