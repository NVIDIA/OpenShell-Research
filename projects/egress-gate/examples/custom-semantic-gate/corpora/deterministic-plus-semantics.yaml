version: 1
cases:
  - name: deterministic-delete-is-denied
    tags: [deterministic]
    provenance:
      kind: synthetic
      redacted: true
    request:
      context:
        request_id: corpus-delete
        sandbox_id: sandbox-example
      target:
        scheme: https
        host: api.example.com
        port: 443
        method: DELETE
        path: /v1/items/1
        query: ""
      headers: []
      body:
        encoding: utf8
        value: '{}'
    expected:
      decision: deny
      decision_source_kind: gate
      gate_name: deterministic-danger
      gate_type: request-rules
      finding_types: [request_rule_match]
  - name: semantic-marker-is-denied
    tags: [semantic]
    provenance:
      kind: synthetic
      redacted: true
    request:
      context:
        request_id: corpus-semantic-deny
        sandbox_id: sandbox-example
      target:
        scheme: https
        host: api.example.com
        port: 443
        method: POST
        path: /v1/items
        query: ""
      headers: []
      body:
        encoding: utf8
        value: "body contains [semantic-deny]"
    expected:
      decision: deny
      decision_source_kind: gate
      gate_name: semantic-review
      gate_type: semantic-judge
      finding_types: [semantic_assessment]
  - name: ordinary-request-is-allowed
    tags: [semantic]
    provenance:
      kind: synthetic
      redacted: true
    request:
      context:
        request_id: corpus-allow
        sandbox_id: sandbox-example
      target:
        scheme: https
        host: api.example.com
        port: 443
        method: POST
        path: /v1/items
        query: ""
      headers: []
      body:
        encoding: utf8
        value: '{"item":"ordinary"}'
    expected:
      decision: allow
      decision_source_kind: gate
      gate_name: semantic-review
      gate_type: semantic-judge
  - name: static-known-read-skips-semantic
    tags: [deterministic]
    provenance:
      kind: synthetic
      redacted: true
    request:
      context:
        request_id: corpus-static-allow
        sandbox_id: sandbox-example
      target:
        scheme: https
        host: api.github.com
        port: 443
        method: GET
        path: /repos/acme/project
        query: ""
      headers: []
      body:
        encoding: utf8
        value: "body contains [semantic-deny]"
    expected:
      decision: allow
      decision_source_kind: gate
      gate_name: deterministic-danger
      gate_type: request-rules
      finding_types: [request_rule_match]
