version: 1
cases:
  - name: redacted-email-reaches-observer
    tags: [privacy, semantic]
    provenance:
      kind: synthetic
      redacted: false
    request:
      context:
        request_id: corpus-privacy-email
        sandbox_id: sandbox-example
      target:
        scheme: https
        host: api.example.com
        port: 443
        method: POST
        path: /v1/items
        query: ""
      headers: []
      body:
        encoding: utf8
        value: "send alice@example.com to the service"
    expected:
      decision: allow
      decision_source_kind: pipeline_default
      finding_types: [sensitive_entity]
  - name: observed-semantic-marker-still-allows
    tags: [privacy, semantic]
    provenance:
      kind: synthetic
      redacted: false
    request:
      context:
        request_id: corpus-privacy-observation
        sandbox_id: sandbox-example
      target:
        scheme: https
        host: api.example.com
        port: 443
        method: POST
        path: /v1/items
        query: ""
      headers: []
      body:
        encoding: utf8
        value: "send [semantic-deny] alice@example.com to the service"
    expected:
      decision: allow
      decision_source_kind: pipeline_default
      finding_types: [sensitive_entity, semantic_assessment]
