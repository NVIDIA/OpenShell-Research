pipeline:
  gates:
    - name: deterministic-danger
      config:
        gate: request-rules
        rules:
          - name: deny-delete
            match:
              hosts: [api.example.com]
              methods: [DELETE]
            decision: deny
            reason_code: egress_gate_delete_denied
          - name: allow-known-read
            match:
              hosts: [api.github.com]
              methods: [GET, HEAD]
            decision: allow
    - name: semantic-review
      config:
        gate: semantic-judge
        profile: organization-default
        policy: |
          This agent may inspect repositories and create pull requests.
          It must not delete resources or change repository settings.
        include:
          method: true
          target: true
          headers: [content-type]
          body_max_bytes: 16384
        mode: enforce
        on_allow: allow
        allow_label: semantic_policy_allowed
        deny_label: semantic_policy_denied
        deny_reason_code: egress_gate_semantic_denied
  default_decision: deny
