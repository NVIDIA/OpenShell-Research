pipeline:
  gates:
    - name: redact-identifiers
      config:
        gate: regex-body
        pattern_catalog:
          entities:
            - name: email
              rules:
                - pattern: '(?<![\w.+-])[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}(?![\w.-])'
                  confidence: high
        mode: replace
        replacement:
          strategy: template
          template: "[{entity}]"
    - name: semantic-observer
      config:
        gate: semantic-judge
        profile: organization-default
        policy: |
          This agent may send ordinary provider requests after deterministic
          privacy replacement.
        include:
          target: true
          body_max_bytes: 16384
        mode: observe
        on_allow: allow
        deny_label: semantic_policy_denied
        observation_label: semantic_policy_observed
        deny_reason_code: egress_gate_semantic_denied
  default_decision: allow
