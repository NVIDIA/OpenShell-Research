version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  github_client:
    name: GitHub request-rules example
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - { path: /usr/local/bin/agent }

network_middlewares:
  egress_gate_deterministic:
    name: Allow known GitHub reads and deny deletes
    middleware: egress-gate-deterministic
    order: 0
    config:
      pipeline:
        gates:
          - name: known-traffic
            config:
              gate: request-rules
              rules:
                - name: deny-destructive-github
                  match:
                    hosts: [api.github.com]
                    methods: [DELETE]
                  decision: deny
                  reason_code: destructive_method_denied
                - name: allow-known-read
                  match:
                    schemes: [https]
                    hosts: [api.github.com]
                    ports: [443]
                    methods: [GET, HEAD]
                    path:
                      type: glob
                      value: /repos/acme/*
                  decision: allow
        default_decision: deny
    on_error: fail_closed
    endpoints:
      include:
        - api.github.com
