pipeline:
  gates:
    - name: known-traffic
      config:
        gate: request-rules
        rules:
          - name: deny-destructive-github
            match:
              hosts: [api.github.com]
              methods: [DELETE]
            decision: deny
            reason_code: destructive_method_denied
          - name: allow-known-read
            match:
              schemes: [https]
              hosts: [api.github.com]
              ports: [443]
              methods: [GET, HEAD]
              path:
                type: glob
                value: /repos/acme/*
            decision: allow
  default_decision: deny
