version: 1
cases:
  - name: known-read-is-allowed
    provenance:
      kind: synthetic
      redacted: true
    request:
      context:
        request_id: corpus-known-read
        sandbox_id: sandbox-example
      target:
        scheme: https
        host: api.github.com
        port: 443
        method: GET
        path: /repos/acme/project
        query: ""
      headers: []
      body:
        encoding: utf8
        value: '{}'
    expected:
      decision: allow
      decision_source_kind: gate
      gate_name: known-traffic
      gate_type: request-rules
      finding_types: [request_rule_match]
  - name: destructive-read-is-denied
    provenance:
      kind: synthetic
      redacted: true
    request:
      context:
        request_id: corpus-delete
        sandbox_id: sandbox-example
      target:
        scheme: https
        host: api.github.com
        port: 443
        method: DELETE
        path: /repos/acme/project
        query: ""
      headers: []
      body:
        encoding: utf8
        value: '{}'
    expected:
      decision: deny
      decision_source_kind: gate
      gate_name: known-traffic
      gate_type: request-rules
      finding_types: [request_rule_match]
