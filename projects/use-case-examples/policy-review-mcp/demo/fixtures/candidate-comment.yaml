version: 1
filesystem_policy:
  include_workdir: false
  read_only: [/usr, /etc]
  read_write: [/tmp]
landlock: {compatibility: hard_requirement}
process: {run_as_user: sandbox, run_as_group: sandbox}
network_policies:
  github:
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /repos/acme/widget/issues/42}
          - allow: {method: GET, path: /repos/acme/widget/issues/42/comments}
          - allow: {method: POST, path: /repos/acme/widget/issues/42/comments}
    binaries: [{path: /usr/bin/gh}]
