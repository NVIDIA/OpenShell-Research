        - This is a modeled prepared runtime, not a claim about an arbitrary gh installation.
        - The preloaded self-contained gh executable requires read access only to /usr/bin/gh and the TLS trust file /etc/ssl/certs/ca-certificates.crt.
        - Authentication is supplied in the environment. No config, cache, scratch, or other filesystem writes are needed. Responses are returned in memory.
        - Network requests must be limited to the exact delegated task.
