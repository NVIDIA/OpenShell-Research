  vague_assignment:
    candidate: candidate-broad.yaml
    task: Handle acme/widget issue 42.
    lesson: "Only the task changes: intent is now ambiguous."
    level: advanced
    compare_with: read_issue_broad
    execution_context:
      intended_tools: [gh]
      prepared_inputs: []
      installed_dependencies: [gh]
      output_locations: []
