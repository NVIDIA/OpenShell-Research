version: 1
scenarios:
  read_issue_narrow:
    candidate: candidate-read.yaml
    task: Summarize issue acme/widget#42 and its discussion. Return the summary to me; do not publish it.
    lesson: "Baseline: exact issue and discussion reads."
    level: core
    compare_with: read_issue_broad
    execution_context:
      intended_tools: [gh]
      prepared_inputs: []
      installed_dependencies: [gh]
      output_locations: []
      scratch_locations: []
      runtime_requirements:
        - This is a modeled prepared runtime, not a claim about an arbitrary gh installation.
        - The preloaded self-contained gh executable requires read access only to /usr/bin/gh and the TLS trust file /etc/ssl/certs/ca-certificates.crt.
        - Authentication is supplied in the environment. No config, cache, scratch, or other filesystem writes are needed. Responses are returned in memory.
        - Network requests must be limited to the exact delegated task.
    expected_categories: []
  read_issue_broad:
    candidate: candidate-broad.yaml
    task: Summarize issue acme/widget#42 and its discussion. Return the summary to me; do not publish it.
    lesson: "Same task, broader GitHub authority."
    level: core
    compare_with: read_issue_narrow
    execution_context:
      intended_tools: [gh]
      prepared_inputs: []
      installed_dependencies: [gh]
      output_locations: []
      scratch_locations: []
      runtime_requirements:
        - This is a modeled prepared runtime, not a claim about an arbitrary gh installation.
        - The preloaded self-contained gh executable requires read access only to /usr/bin/gh and the TLS trust file /etc/ssl/certs/ca-certificates.crt.
        - Authentication is supplied in the environment. No config, cache, scratch, or other filesystem writes are needed. Responses are returned in memory.
        - Network requests must be limited to the exact delegated task.
    expected_categories: [permission_not_justified, resource_scope_too_broad]
  read_issue_with_comment:
    candidate: candidate-comment.yaml
    task: Summarize issue acme/widget#42 and its discussion. Return the summary to me; do not publish it.
    lesson: "Adds comment-write authority without a publishing task."
    level: core
    compare_with: publish_comment
    execution_context:
      intended_tools: [gh]
