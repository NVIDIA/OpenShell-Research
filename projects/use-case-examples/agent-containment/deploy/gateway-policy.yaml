# Only sandbox supervisors and other gateway replicas may call the gateway pod,
# plus the control node itself (the operator CLI and kubelet probes). Every
# node can otherwise reach in-cluster addresses and NodePorts, so without this
# policy a sandbox node's host could open connections to the gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openshell-gateway
  namespace: openshell
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openshell
      app.kubernetes.io/instance: openshell
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              openshell.ai/boundary-role: supervisor
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openshell
              app.kubernetes.io/instance: openshell
