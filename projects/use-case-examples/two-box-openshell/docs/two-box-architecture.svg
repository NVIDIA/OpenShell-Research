<!-- Visual style follows docs/images/openshell-system-architecture.svg in NVIDIA/OpenShell. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Two-box OpenShell architecture</title>
  <desc id="desc">One k3s cluster across two machines. The control node runs the OpenShell gateway, every sandbox's supervisor, and the egress watchdog. A sandbox node accepts only network-isolated sandbox workloads; more sandbox nodes join the same way. Each workload's only network path is a mediated channel to its supervisor on the control node. The supervisor sends every request to the watchdog, then makes policy-approved connections to external services. The sandbox node holds no policy, credentials, signing keys, or watchdog.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#579000"/>
    </marker>
    <style>
      .section { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; letter-spacing: .08em; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .soft { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .green { fill: #f2f9e8; stroke: #76b900; stroke-width: 2.5; }
      .trusted { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; }
      .dark { fill: #1f2937; stroke: #111827; stroke-width: 2; }
      .line { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .flow { fill: none; stroke: #579000; stroke-width: 3; marker-end: url(#arrow-green); }
      .blocked { fill: none; stroke: #c2413b; stroke-width: 2.5; stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1280" height="800" rx="20" fill="#ffffff"/>

  <!-- External services -->
  <text x="45" y="46" class="section">EXTERNAL SERVICES</text>
  <rect x="40" y="60" width="600" height="84" rx="18" class="soft"/>
  <rect x="75" y="76" width="240" height="52" rx="12" class="box"/>
  <text x="195" y="97" text-anchor="middle" class="label">Allowed APIs</text>
  <text x="195" y="117" text-anchor="middle" class="small">registries, tools, data</text>
  <rect x="365" y="76" width="240" height="52" rx="12" class="box"/>
  <text x="485" y="97" text-anchor="middle" class="label">Models</text>
  <text x="485" y="117" text-anchor="middle" class="small">inference APIs</text>

  <!-- The control node -->
  <text x="45" y="206" class="section">CONTROL NODE</text>
  <rect x="40" y="220" width="600" height="440" rx="18" class="soft"/>

  <rect x="75" y="250" width="240" height="84" rx="14" class="trusted"/>
  <text x="195" y="282" text-anchor="middle" class="label">Gateway</text>
  <text x="195" y="306" text-anchor="middle" class="small">policy, credentials,</text>
  <text x="195" y="324" text-anchor="middle" class="small">signing keys</text>

  <rect x="395" y="250" width="210" height="84" rx="14" class="green"/>
  <text x="500" y="282" text-anchor="middle" class="label">Egress watchdog</text>
  <text x="500" y="306" text-anchor="middle" class="small">accounting, byte budgets,</text>
  <text x="500" y="324" text-anchor="middle" class="small">quarantine</text>

  <rect x="75" y="400" width="530" height="170" rx="16" class="trusted"/>
  <text x="340" y="436" text-anchor="middle" class="label">Supervisors</text>
  <text x="340" y="458" text-anchor="middle" class="tiny">ONE PER SANDBOX · GOVERNS THE AGENT</text>
  <text x="340" y="498" text-anchor="middle" class="small">Policy evaluation · Credential injection</text>
  <text x="340" y="524" text-anchor="middle" class="small">TLS termination · Upstream connections</text>

  <text x="340" y="636" text-anchor="middle" class="tiny">SUPERVISORS NEVER RUN ON SANDBOX NODES</text>

  <path d="M 195 334 V 400" class="line"/>
  <path d="M 500 400 V 334" class="line"/>
  <text x="512" y="372" class="tiny">EVERY REQUEST</text>
  <path d="M 355 400 V 144" class="flow"/>
  <text x="367" y="182" class="tiny">POLICY-APPROVED EGRESS</text>

  <!-- The sandbox node -->
  <text x="725" y="206" class="section">SANDBOX NODE · SANDBOXES ONLY</text>
  <rect x="720" y="220" width="520" height="440" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 7"/>

  <rect x="760" y="250" width="440" height="250" rx="18" fill="#ffffff" stroke="#76b900" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="980" y="281" text-anchor="middle" class="tiny">SANDBOX WORKLOADS · NETWORK ISOLATED</text>
  <rect x="795" y="296" width="370" height="78" rx="14" class="box"/>
  <text x="980" y="329" text-anchor="middle" class="label">Sandbox</text>
  <text x="980" y="353" text-anchor="middle" class="small">process owner and syscall boundary</text>
  <rect x="795" y="406" width="370" height="64" rx="14" class="dark"/>
  <text x="980" y="434" text-anchor="middle" style="font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">Agent</text>
  <text x="980" y="456" text-anchor="middle" style="font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#d1d5db">untrusted workload</text>
  <path d="M 980 374 V 406" class="line"/>

  <rect x="760" y="536" width="440" height="96" rx="12" class="green"/>
  <text x="980" y="562" text-anchor="middle" class="tiny">WORKLOAD NETWORK RULE</text>
  <text x="980" y="588" text-anchor="middle" class="label">Deny all egress</text>
  <text x="980" y="610" text-anchor="middle" class="small">except the channel to its supervisor</text>

  <!-- Mediated channel between the boxes -->
  <path d="M 795 335 H 680 V 485 H 605" class="flow"/>
  <text x="680" y="296" text-anchor="middle" class="tiny">MEDIATED</text>
  <text x="680" y="312" text-anchor="middle" class="tiny">CHANNEL</text>

  <!-- No direct egress from the sandbox node -->
  <path d="M 1165 335 H 1215 V 160" class="blocked"/>
  <line x1="1206" y1="140" x2="1224" y2="158" stroke="#c2413b" stroke-width="3"/>
  <line x1="1224" y1="140" x2="1206" y2="158" stroke="#c2413b" stroke-width="3"/>
  <text x="1195" y="128" text-anchor="end" class="tiny">NO DIRECT EGRESS</text>

  <!-- What each box holds -->
  <rect x="40" y="690" width="600" height="80" rx="14" class="box"/>
  <text x="60" y="720" class="tiny">CONTROL NODE HOLDS</text>
  <text x="60" y="748" class="small">Policy · provider credentials · signing keys · the watchdog</text>
  <rect x="720" y="690" width="520" height="80" rx="14" class="box"/>
  <text x="740" y="720" class="tiny">SANDBOX NODE HOLDS</text>
  <text x="740" y="748" class="small">Sandbox workloads · a join-only token</text>
</svg>
