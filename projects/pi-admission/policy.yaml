version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  model_provider:
    name: Configured model endpoint
    endpoints:
      - host: api.example.com # prepare replaces this from models.json.
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/curl }

  admission:
    name: Authenticated admission API
    endpoints:
      - host: host.docker.internal # prepare replaces this with PI_ADMISSION_HOST.
        port: 5443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/admission
    binaries:
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/curl }

network_middlewares:
  pi_admission:
    name: Verify admitted Pi provider context
    middleware: pi-admission
    order: 0
    config: {}
    on_error: fail_closed
    endpoints:
      include:
        - api.example.com # prepare replaces this from models.json.
