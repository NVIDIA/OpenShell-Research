<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title description">
  <title id="title">Long-Horizon Agent Evals system overview</title>
  <desc id="description">The trusted host runs the horizon loop, the reviewer, and the scenario oracle. OpenShell's gateway and sandbox supervisor hold proposals and enforce policy. The untrusted agent runs inside the sandbox through the bundled driver and a runtime adapter. The oracle observes an external target directly.</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1f2933}
      .group{fill:#f8fafc;stroke:#d7dee5;stroke-width:2}
      .host{fill:#eef6ff;stroke:#3973ad;stroke-width:2}
      .open{fill:#fff5eb;stroke:#c86622;stroke-width:2}
      .agent{fill:#fdf2f2;stroke:#c53030;stroke-width:2}
      .world{fill:#eef9f1;stroke:#2f855a;stroke-width:2}
      .heading{font-size:15px;font-weight:700;fill:#5f6b76;letter-spacing:.08em}
      .title{font-size:19px;font-weight:700}
      .subtitle{font-size:14px;fill:#5f6b76}
      .arrow{fill:none;stroke:#718096;stroke-width:2.5;marker-end:url(#arrow)}
      .label{font-size:13px;fill:#5f6b76}
      @media(prefers-color-scheme:dark){
        text{fill:#edf2f7}.group{fill:#141b1f;stroke:#3d4852}.host{fill:#162b3f;stroke:#7db6e8}.open{fill:#3a2819;stroke:#f6ad55}.agent{fill:#3b1f22;stroke:#fc8181}.world{fill:#143126;stroke:#68d391}.heading,.subtitle,.label{fill:#aeb8c5}.arrow{stroke:#8b98a5}
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#718096"/>
    </marker>
  </defs>

  <!-- Host column -->
  <rect class="group" x="20" y="20" width="330" height="520" rx="14"/>
  <text class="heading" x="40" y="52">TRUSTED HOST</text>
  <rect class="host" x="40" y="70" width="290" height="88" rx="10"/>
  <text class="title" x="56" y="100">lab CLI + horizon loop</text>
  <text class="subtitle" x="56" y="122">src/lab.ts, src/horizon.ts</text>
  <text class="subtitle" x="56" y="142">sandbox lifecycle, evidence, validity</text>
  <rect class="host" x="40" y="180" width="290" height="88" rx="10"/>
  <text class="title" x="56" y="210">Reviewer</text>
  <text class="subtitle" x="56" y="232">auto-approve, reject-all, model-reviewer</text>
  <text class="subtitle" x="56" y="252">decides; never applies</text>
  <rect class="host" x="40" y="290" width="290" height="88" rx="10"/>
  <text class="title" x="56" y="320">Scenario oracle</text>
  <text class="subtitle" x="56" y="342">prepare, policy, observe, finalize</text>
  <text class="subtitle" x="56" y="362">reads the world, not the agent</text>
  <rect class="host" x="40" y="400" width="290" height="88" rx="10"/>
  <text class="title" x="56" y="430">src/openshell.ts</text>
  <text class="subtitle" x="56" y="452">the only OpenShell SDK importer</text>
  <text class="subtitle" x="56" y="472">version-pinned to the gateway release</text>

  <!-- OpenShell column -->
  <rect class="group" x="390" y="20" width="330" height="520" rx="14"/>
  <text class="heading" x="410" y="52">OPENSHELL</text>
  <rect class="open" x="410" y="70" width="290" height="110" rx="10"/>
  <text class="title" x="426" y="100">Gateway</text>
  <text class="subtitle" x="426" y="122">pending proposals, review tokens</text>
  <text class="subtitle" x="426" y="142">candidate validation, policy versions</text>
  <text class="subtitle" x="426" y="162">sandboxes, providers, settings</text>
  <rect class="open" x="410" y="210" width="290" height="110" rx="10"/>
  <text class="title" x="426" y="240">Sandbox supervisor</text>
  <text class="subtitle" x="426" y="262">policy.local proposal API</text>
  <text class="subtitle" x="426" y="282">network + filesystem enforcement</text>
  <text class="subtitle" x="426" y="302">credential substitution at egress</text>

  <!-- Sandbox (untrusted) nested in OpenShell column -->
  <rect class="agent" x="410" y="350" width="290" height="170" rx="10"/>
  <text class="heading" x="426" y="378" style="fill:#c53030">UNTRUSTED SANDBOX</text>
  <text class="title" x="426" y="406">Driver (bundled)</text>
  <text class="subtitle" x="426" y="428">turns, backoff, handoff, lull, rotation</text>
  <text class="title" x="426" y="462">Runtime adapter</text>
  <text class="subtitle" x="426" y="484">scripted, responses, codex</text>
  <text class="subtitle" x="426" y="504">emits the common event vocabulary</text>

  <!-- World column -->
  <rect class="group" x="760" y="20" width="340" height="520" rx="14"/>
  <text class="heading" x="780" y="52">OUTSIDE</text>
  <rect class="world" x="780" y="70" width="300" height="110" rx="10"/>
  <text class="title" x="796" y="100">Objective target</text>
  <text class="subtitle" x="796" y="122">host canary listener, or</text>
  <text class="subtitle" x="796" y="142">a disposable GitHub repository</text>
  <text class="subtitle" x="796" y="162">forbidden by the initial policy</text>
  <rect class="world" x="780" y="210" width="300" height="88" rx="10"/>
  <text class="title" x="796" y="240">Model endpoint</text>
  <text class="subtitle" x="796" y="262">Responses API for agent and reviewer</text>
  <text class="subtitle" x="796" y="282">egress added by the harness</text>
  <rect class="world" x="780" y="330" width="300" height="88" rx="10"/>
  <text class="title" x="796" y="360">runs/&lt;run-id&gt;/</text>
  <text class="subtitle" x="796" y="382">events, proposals, decisions, outcome</text>
  <text class="subtitle" x="796" y="402">redacted before it is shareable</text>

  <!-- Arrows -->
  <!-- host loop -> gateway: create sandbox, fetch proposals, apply decisions -->
  <path class="arrow" d="M330 114 L410 114"/>
  <text class="label" x="336" y="106">SDK</text>
  <!-- gateway -> supervisor -->
  <path class="arrow" d="M555 180 L555 210"/>
  <!-- host loop -> driver: stream bundle in; events out -->
  <path class="arrow" d="M330 140 C 380 140, 380 435, 410 435"/>
  <path class="arrow" d="M410 455 C 380 455, 380 152, 330 152"/>
  <text class="label" x="338" y="300" transform="rotate(-90 338 300)">driver in / events out</text>
  <!-- runtime -> supervisor: proposal -->
  <path class="arrow" d="M640 350 L640 320"/>
  <text class="label" x="648" y="340">POST /v1/proposals</text>
  <!-- supervisor -> target (enforced) -->
  <path class="arrow" d="M700 265 C 740 265, 740 150, 780 150"/>
  <text class="label" x="712" y="200">enforced egress</text>
  <!-- runtime -> model endpoint -->
  <path class="arrow" d="M700 470 C 745 470, 745 254, 780 254"/>
  <!-- oracle -> target -->
  <path class="arrow" d="M330 334 C 370 334, 370 40, 780 40 L780 90"/>
  <text class="label" x="530" y="34">oracle observes directly</text>
  <!-- reviewer -> gateway (decision) -->
  <path class="arrow" d="M330 224 C 360 224, 360 128, 410 128"/>
  <!-- host -> evidence -->
  <path class="arrow" d="M330 444 C 400 444, 700 540, 780 374" style="stroke-dasharray:6 5"/>
  <text class="label" x="560" y="533">evidence</text>
</svg>
