<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 824" role="img" aria-labelledby="title description">
  <title id="title">One OAR run across the caller, gateway, and sandbox</title>
  <desc id="description">OAR loads the selected profile task and caller inputs, resolves prompt variables, creates an OpenShell sandbox with the profile policy, and uploads the task resources. Inside the sandbox, Pi uses its tools and the gateway's configured inference connection. OAR downloads the result, checks its size and optional schema, writes the host output, and verifies ownership before deleting the sandbox. The gateway remains available. Failures also trigger cleanup attempts.</desc>
  <defs>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#24352c}
      .host{fill:#f4f5f2;stroke:#c8cec8;stroke-width:1.5}
      .gateway{fill:#f5f9ee;stroke:#7da54b;stroke-width:2}
      .sandbox{fill:#fff;stroke:#9dad9e;stroke-width:1.5;stroke-dasharray:5 4}
      .card{fill:#fff;stroke:#b9c8bf;stroke-width:1.2}
      .profile{fill:#edf4e3;stroke:#b5c99c;stroke-width:1.2}
      .schema{fill:#eaf2f8;stroke:#8aa9c0;stroke-width:1.2}
      .accent{fill:#eaf3dc;stroke:#8eaf62;stroke-width:1.2}
      .heading{font-size:23px;font-weight:650}
      .title{font-size:20px;font-weight:650}
      .note{font-size:16px;fill:#53665a}
      .small{font-size:14px;fill:#53665a}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
      .flow{fill:none;stroke:#658941;stroke-width:2;marker-end:url(#arrow)}
      .schema-flow{fill:none;stroke:#668ba9;stroke-width:2;stroke-dasharray:5 4;marker-end:url(#schema-arrow)}
      .schema-label{font-size:14px;fill:#527997}
      .retry{fill:none;stroke:#ad7738;stroke-width:1.8;marker-end:url(#retry-arrow)}
      .retry-label{font-size:14px;fill:#95642c}
      .inference{fill:none;stroke:#73877b;stroke-width:1.7;marker-start:url(#inference-arrow);marker-end:url(#inference-arrow)}
      @media(prefers-color-scheme:dark){
        text{fill:#edf3ee}
        .host{fill:#202722;stroke:#59685e}
        .gateway{fill:#23301b;stroke:#8eaf62}
        .sandbox,.card{fill:#1c2720;stroke:#859788}
        .profile,.accent{fill:#2b3b23;stroke:#7b9c57}
        .schema{fill:#273b47;stroke:#799cac}
        .note,.small{fill:#bdcbbf}
        .schema-label{fill:#a7c6dd}
        .schema-flow{stroke:#93b4ce}
        .flow{stroke:#8eb55d}
        .retry{stroke:#d6a15f}
        .retry-label{fill:#e2b174}
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#719447"/>
    </marker>
    <marker id="schema-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#668ba9"/>
    </marker>
    <marker id="retry-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#ad7738"/>
    </marker>
    <marker id="inference-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#73877b"/>
    </marker>
  </defs>

  <rect x="20" y="22" width="358" height="742" rx="16" class="host"/>
  <text x="42" y="58" class="heading">OAR · your machine / CI</text>
  <rect x="42" y="91" width="314" height="141" rx="10" class="profile"/>
  <text x="60" y="120" class="title">1. Load task + inputs</text>
  <text x="60" y="149" class="mono small">profile.yaml → selected task</text>
  <text x="60" y="177" class="small">Prompts · skills · optional schema</text>
  <text x="60" y="202" class="small">Policy · model settings</text>
  <text x="60" y="224" class="mono small">--input ...   --output ...</text>
  <path d="M199 232v41" class="flow"/>

  <rect x="42" y="275" width="314" height="99" rx="8" class="card"/>
  <text x="60" y="305" class="title">2. Prepare and upload</text>
  <text x="60" y="333" class="note">Resolve prompt variables</text>
  <text x="60" y="359" class="small">Create sandbox with profile policy</text>

  <rect x="464" y="22" width="356" height="742" rx="16" class="gateway"/>
  <text x="486" y="58" class="heading">OpenShell gateway</text>
  <rect x="486" y="100" width="312" height="60" rx="8" class="accent"/>
  <text x="506" y="126" class="title">Configured inference</text>
  <text x="506" y="149" class="small">Connection to your model</text>

  <rect x="486" y="254" width="312" height="356" rx="10" class="sandbox"/>
  <text x="506" y="285" class="title">Temporary sandbox</text>
  <rect x="500" y="305" width="284" height="86" rx="7" class="profile"/>
  <text x="516" y="333" class="note">Uploaded for this task</text>
  <text x="516" y="358" class="small">Input · prompt · skills</text>
  <text x="516" y="381" class="small">Schema, when configured</text>
  <path d="M356 331h142" class="flow"/>
  <text x="420" y="317" text-anchor="middle" class="small">create +</text>
  <text x="420" y="354" text-anchor="middle" class="small">upload</text>
  <path d="M642 391v41" class="flow"/>

  <rect x="508" y="434" width="264" height="80" rx="8" class="accent"/>
  <text x="526" y="465" class="title">3. Run Pi agent</text>
  <text x="526" y="493" class="small">Use tools within sandbox policy</text>
  <path d="M774 474h34V130h-8" class="inference"/>
  <path d="M642 514v32" class="flow"/>
  <rect x="508" y="548" width="264" height="43" rx="7" class="card"/>
  <text x="642" y="575" text-anchor="middle" class="title">Task result</text>

  <rect x="42" y="507" width="314" height="115" rx="8" class="schema"/>
  <text x="60" y="537" class="title">4. Check and save result</text>
  <text x="60" y="566" class="small">Download · size · optional schema</text>
  <text x="60" y="595" class="mono note">Write to --output</text>
  <path d="M508 569H358" class="flow"/>
  <text x="420" y="555" text-anchor="middle" class="small">download</text>
  <path d="M199 622v43" class="flow"/>

  <rect x="42" y="667" width="314" height="66" rx="8" class="card"/>
  <text x="60" y="695" class="title">5. Clean up</text>
  <text x="60" y="719" class="note">Check sandbox ownership</text>
  <path d="M356 699h128" class="flow"/>
  <text x="420" y="686" text-anchor="middle" class="small">delete</text>
  <rect x="486" y="652" width="312" height="89" rx="8" class="card"/>
  <text x="506" y="685" class="title">Remove this sandbox</text>
  <text x="506" y="716" class="note">Keep gateway running</text>

  <text x="420" y="799" text-anchor="middle" class="note">Failures also trigger cleanup attempts. Use --keep-sandbox to retain it.</text>
</svg>
