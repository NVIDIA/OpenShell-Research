<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title description">
  <title id="title">Choose text or JSON output</title>
  <desc id="description">Without an output schema, the final text response becomes the result. With a schema, the agent submits JSON and can correct validation errors. OAR checks the downloaded result before saving it.</desc>
  <defs>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#24352c}
      .box{fill:#f6f8f7;stroke:#b9c8bf;stroke-width:1.5}
      .accent{fill:#edf6dc;stroke:#76a938;stroke-width:1.5}
      .title{font-size:22px;font-weight:650}
      .note{font-size:16px;fill:#53665a}
      .arrow{fill:none;stroke:#73877b;stroke-width:2;marker-end:url(#arrow)}
      @media(prefers-color-scheme:dark){text{fill:#edf3ee}.box{fill:#202c25;stroke:#64786c}.accent{fill:#2b3c1e;stroke:#8fba53}.note{fill:#c2cec5}}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#73877b"/>
    </marker>
  </defs>
  <rect x="185" y="22" width="270" height="60" rx="12" class="box"/>
  <text x="320" y="60" text-anchor="middle" class="title">Result format</text>
  <path d="M240 82V110H165V143M400 82V110H475V143" class="arrow"/>
  <text x="160" y="101" text-anchor="middle" class="note">No schema</text>
  <text x="480" y="101" text-anchor="middle" class="note">With a schema</text>
  <rect x="25" y="145" width="280" height="100" rx="12" class="box"/>
  <text x="165" y="181" text-anchor="middle" class="title">Final text</text>
  <text x="165" y="212" text-anchor="middle" class="note">Agent's final response</text>
  <rect x="335" y="145" width="280" height="100" rx="12" class="accent"/>
  <text x="475" y="176" text-anchor="middle" class="title">Submitted JSON</text>
  <text x="475" y="203" text-anchor="middle" class="note">Agent calls submit_result</text>
  <text x="475" y="229" text-anchor="middle" class="note">Can correct invalid submissions</text>
  <path d="M165 245V275H270V300M475 245V275H370V300" class="arrow"/>
  <rect x="130" y="302" width="380" height="68" rx="12" class="accent"/>
  <text x="320" y="331" text-anchor="middle" class="title">Check and save</text>
  <text x="320" y="356" text-anchor="middle" class="note">OAR validates the downloaded result</text>
</svg>
