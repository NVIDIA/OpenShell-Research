id: slop-cop
description: Review an input document for formulaic, vague, inflated, or generic prose.

sandbox:
  policy: policy.yaml

tasks:
  review-document:
    description: Review an input document for material writing-slop patterns.
    required_input: document
    prompt: prompt-document.md
    prompt_variables:
      focus:
        description: Sections or prose concerns that deserve special attention.
        default: Review the complete document.
      context:
        description: Intended audience, voice, genre, or publication setting.
        default: No additional context was provided.
    output_schema: schemas/review.json
    tools: [read, grep]
    skills: [skills/review-writing-slop]
