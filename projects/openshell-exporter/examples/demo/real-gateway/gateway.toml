[openshell]
version = 1

[openshell.gateway]
bind_address = "0.0.0.0:8080"
health_bind_address = "0.0.0.0:8081"
log_level = "info"
compute_drivers = ["docker"]
disable_tls = true

[openshell.gateway.gateway_jwt]
signing_key_path = "/etc/openshell/jwt/signing.pem"
public_key_path = "/etc/openshell/jwt/public.pem"
kid_path = "/etc/openshell/jwt/kid"
gateway_id = "docker-demo-gateway"
ttl_secs = 3600

[openshell.gateway.auth]
allow_unauthenticated_users = true

[openshell.drivers.docker]
default_image = "ghcr.io/nvidia/openshell-community/sandboxes/base:latest@sha256:aeef1c63f00e2913ea002ccb3aaf925f338b5c5d70e63576f0d95c16a138044e"
supervisor_image = "ghcr.io/nvidia/openshell/supervisor:0.0.113@sha256:28f6a05314fb9aba73b0c6518aed3ffbde4b51565bfe92477241d2c94488cfbb"
image_pull_policy = "IfNotPresent"
sandbox_namespace = "openshell-exporter-demo"
network_name = "openshell-exporter-demo"
grpc_endpoint = "http://host.openshell.internal:8080"
