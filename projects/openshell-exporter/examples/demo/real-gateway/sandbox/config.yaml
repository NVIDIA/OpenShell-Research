_config_version: 12
model:
  default: nvidia/nemotron-3-super-120b-a12b
  provider: custom
  base_url: https://inference.local/v1
agent:
  max_turns: 20
  reasoning_effort: medium
terminal:
  backend: local
  timeout: 120
approvals:
  mode: off
plugins:
  enabled:
    - observability/nemo_relay
gateway:
  telemetry:
    session_segments:
      on_compaction: true
      max_turns: 1
