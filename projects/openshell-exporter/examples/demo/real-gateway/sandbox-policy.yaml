version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /etc
    - /opt/hermes
    - /proc/self
    - /dev/urandom
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

network_policies:
  exporter_otlp:
    name: Authenticated exporter OTLP
    endpoints:
      - host: exporter.demo.internal
        port: 4318
    binaries:
      - path: /usr/bin/python3.13
