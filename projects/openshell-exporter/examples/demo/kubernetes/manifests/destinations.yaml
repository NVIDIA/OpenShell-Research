apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: conformance-receiver-tls
  namespace: openshell-observability
  labels: {app.kubernetes.io/part-of: openshell-kubernetes-demo}
spec:
  secretName: conformance-receiver-tls
  dnsNames:
    - conformance-receiver
    - conformance-receiver.openshell-observability
    - conformance-receiver.openshell-observability.svc
    - conformance-receiver.openshell-observability.svc.cluster.local
  usages: [server auth]
  issuerRef: {name: openshell-exporter-pki, kind: ClusterIssuer, group: cert-manager.io}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: otlp-sink-tls
  namespace: openshell-observability
  labels: {app.kubernetes.io/part-of: openshell-kubernetes-demo}
spec:
  secretName: otlp-sink-tls
  dnsNames:
    - otlp-sink
    - otlp-sink.openshell-observability
    - otlp-sink.openshell-observability.svc
    - otlp-sink.openshell-observability.svc.cluster.local
  usages: [server auth]
  issuerRef: {name: openshell-exporter-pki, kind: ClusterIssuer, group: cert-manager.io}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: conformance-receiver-nginx
  namespace: openshell-observability
  labels: {app.kubernetes.io/part-of: openshell-kubernetes-demo}
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {}
    http {
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      access_log /dev/stdout;
      error_log /dev/stderr notice;
      server {
        listen 8443 ssl;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /run/tls/tls.crt;
        ssl_certificate_key /run/tls/tls.key;
        client_max_body_size 4m;
        location / {
          proxy_pass http://127.0.0.1:8080;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header Authorization $http_authorization;
          proxy_set_header Content-Type $content_type;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conformance-receiver
  namespace: openshell-observability
  labels: {app.kubernetes.io/part-of: openshell-kubernetes-demo, app.kubernetes.io/component: conformance-receiver}
spec:
  replicas: 1
  selector: {matchLabels: {app: conformance-receiver}}
  template:
    metadata: {labels: {app: conformance-receiver, app.kubernetes.io/part-of: openshell-kubernetes-demo}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: receiver
          image: docker.io/local/openshell-conformance-receiver:kubernetes-demo
          imagePullPolicy: Never
          env:
            - name: WEBAPP_INGEST_TOKEN
              valueFrom: {secretKeyRef: {name: openshell-exporter-destination-auth, key: token}}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsUser: 65532, runAsGroup: 65532, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 250m, memory: 128Mi}}
        - name: tls-proxy
          image: docker.io/nginxinc/nginx-unprivileged:1.29.3-alpine@sha256:5aea7cc516b419e3526f47dd1531be31a56a046cfe44754d94f9383e13e2ee99
          ports: [{name: https, containerPort: 8443}]
          readinessProbe: {tcpSocket: {port: https}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsUser: 101, runAsGroup: 101, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
          volumeMounts:
            - {name: nginx-config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: tls, mountPath: /run/tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
      volumes:
        - {name: nginx-config, configMap: {name: conformance-receiver-nginx}}
        - {name: tls, secret: {secretName: conformance-receiver-tls}}
        - {name: tmp, emptyDir: {sizeLimit: 32Mi}}
        - {name: nginx-cache, emptyDir: {sizeLimit: 32Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: conformance-receiver
  namespace: openshell-observability
  labels: {app.kubernetes.io/part-of: openshell-kubernetes-demo}
spec:
  selector: {app: conformance-receiver}
  ports: [{name: https, port: 8443, targetPort: https}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otlp-sink-config
  namespace: openshell-observability
  labels: {app.kubernetes.io/part-of: openshell-kubernetes-demo}
data:
  config.yaml: |
    extensions:
      bearertokenauth/intake:
        filename: /run/secrets/auth/token
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            auth: {authenticator: bearertokenauth/intake}
            tls: {cert_file: /run/tls/tls.crt, key_file: /run/tls/tls.key}
          http:
            endpoint: 0.0.0.0:4318
            auth: {authenticator: bearertokenauth/intake}
            tls: {cert_file: /run/tls/tls.crt, key_file: /run/tls/tls.key}
    exporters:
      file/logs: {path: /data/logs.json, format: json}
      file/traces: {path: /data/traces.json, format: json}
    service:
      extensions: [bearertokenauth/intake, health_check]
      pipelines:
        logs: {receivers: [otlp], exporters: [file/logs]}
        traces: {receivers: [otlp], exporters: [file/traces]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: otlp-sink-data
  namespace: openshell-observability
  labels: {app.kubernetes.io/part-of: openshell-kubernetes-demo}
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: csi-hostpath-sc
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otlp-sink
  namespace: openshell-observability
  labels: {app.kubernetes.io/part-of: openshell-kubernetes-demo, app.kubernetes.io/component: otlp-sink}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: otlp-sink}}
  template:
    metadata: {labels: {app.kubernetes.io/name: otlp-sink, app.kubernetes.io/part-of: openshell-kubernetes-demo}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: collector
          image: docker.io/local/openshell-event-exporter:kubernetes-demo
          imagePullPolicy: Never
          args: [--config, /etc/otel/config.yaml]
          ports: [{name: grpc, containerPort: 4317}, {name: http, containerPort: 4318}, {name: health, containerPort: 13133}]
          readinessProbe: {httpGet: {path: /, port: health}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          volumeMounts:
            - {name: config, mountPath: /etc/otel, readOnly: true}
            - {name: tls, mountPath: /run/tls, readOnly: true}
            - {name: auth, mountPath: /run/secrets/auth, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: otlp-sink-config}}
        - {name: tls, secret: {secretName: otlp-sink-tls}}
        - {name: auth, secret: {secretName: openshell-exporter-otlp-destination-auth}}
        - {name: data, persistentVolumeClaim: {claimName: otlp-sink-data}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 32Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: otlp-sink
  namespace: openshell-observability
  labels: {app.kubernetes.io/part-of: openshell-kubernetes-demo}
spec:
  selector: {app.kubernetes.io/name: otlp-sink}
  ports:
    - {name: grpc, port: 4317, targetPort: grpc}
    - {name: http, port: 4318, targetPort: http}
