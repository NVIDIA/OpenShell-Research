apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: openshell-elastic-elasticsearch, namespace: openshell-observability}
spec:
  secretName: openshell-elastic-elasticsearch
  usages: [server auth]
  dnsNames: [elasticsearch, elasticsearch.openshell-observability, elasticsearch.openshell-observability.svc, elasticsearch.openshell-observability.svc.cluster.local]
  issuerRef: {name: openshell-exporter-pki, kind: ClusterIssuer, group: cert-manager.io}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: openshell-elastic-kibana, namespace: openshell-observability}
spec:
  secretName: openshell-elastic-kibana
  usages: [server auth]
  dnsNames: [kibana, kibana.openshell-observability, kibana.openshell-observability.svc, kibana.openshell-observability.svc.cluster.local]
  ipAddresses: [127.0.0.1]
  issuerRef: {name: openshell-exporter-pki, kind: ClusterIssuer, group: cert-manager.io}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: openshell-elastic-logstash-server, namespace: openshell-observability}
spec:
  secretName: openshell-elastic-logstash-server
  usages: [server auth]
  dnsNames: [logstash, logstash.openshell-observability, logstash.openshell-observability.svc, logstash.openshell-observability.svc.cluster.local]
  issuerRef: {name: openshell-exporter-pki, kind: ClusterIssuer, group: cert-manager.io}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: openshell-elastic-logstash-client, namespace: openshell-observability}
spec:
  secretName: openshell-elastic-logstash-client
  usages: [client auth]
  commonName: openshell-exporter-logstash
  issuerRef: {name: openshell-exporter-pki, kind: ClusterIssuer, group: cert-manager.io}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: openshell-elastic-apm-server, namespace: openshell-observability}
spec:
  secretName: openshell-elastic-apm-server
  usages: [server auth]
  dnsNames: [apm-server, apm-server.openshell-observability, apm-server.openshell-observability.svc, apm-server.openshell-observability.svc.cluster.local]
  issuerRef: {name: openshell-exporter-pki, kind: ClusterIssuer, group: cert-manager.io}
---
apiVersion: v1
kind: Service
metadata: {name: elasticsearch, namespace: openshell-observability, labels: {app: openshell-elasticsearch}}
spec: {selector: {app: openshell-elasticsearch}, ports: [{name: https, port: 9200, targetPort: https}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: elasticsearch, namespace: openshell-observability}
spec:
  serviceName: elasticsearch
  replicas: 1
  selector: {matchLabels: {app: openshell-elasticsearch}}
  template:
    metadata: {labels: {app: openshell-elasticsearch, app.kubernetes.io/part-of: openshell-soc-demo}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: elasticsearch
          image: docker.io/library/elasticsearch:9.4.3@sha256:fa8f4ebbc41c2d8b88c3371d4159893364ae0ea8306dc62aefecaa1643f2d137
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports: [{name: https, containerPort: 9200}]
          env:
            - {name: discovery.type, value: single-node}
            - {name: cluster.name, value: openshell-security-demo}
            - {name: ELASTIC_PASSWORD, valueFrom: {secretKeyRef: {name: openshell-elastic-credentials, key: ELASTIC_PASSWORD}}}
            - {name: ES_JAVA_OPTS, value: -Xms768m -Xmx768m}
            - {name: xpack.security.enabled, value: "true"}
            - {name: xpack.security.http.ssl.enabled, value: "true"}
            - {name: xpack.security.http.ssl.key, value: certs/tls.key}
            - {name: xpack.security.http.ssl.certificate, value: certs/tls.crt}
            - {name: xpack.security.http.ssl.certificate_authorities, value: certs/ca.crt}
            - {name: ingest.geoip.downloader.enabled, value: "false"}
          readinessProbe:
            exec: {command: [/bin/sh, -ec, 'curl --fail --silent --resolve elasticsearch:9200:127.0.0.1 --cacert config/certs/ca.crt --user "elastic:${ELASTIC_PASSWORD}" https://elasticsearch:9200/_cluster/health >/dev/null']}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /usr/share/elasticsearch/data}
            - {name: tls, mountPath: /usr/share/elasticsearch/config/certs, readOnly: true}
      volumes:
        - {name: tls, secret: {secretName: openshell-elastic-elasticsearch, defaultMode: 288}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], storageClassName: csi-hostpath-sc, resources: {requests: {storage: 5Gi}}}
---
apiVersion: batch/v1
kind: Job
metadata: {name: openshell-elastic-init, namespace: openshell-observability}
spec:
  backoffLimit: 3
  template:
    metadata: {labels: {app.kubernetes.io/part-of: openshell-soc-demo}}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 100, runAsGroup: 101, fsGroup: 101, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: init
          image: docker.io/curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          command: [/bin/sh, -ec, 'until curl --fail --silent --cacert /certs/ca.crt --user "elastic:${ELASTIC_PASSWORD}" https://elasticsearch:9200/_cluster/health >/dev/null; do sleep 3; done; exec /bin/sh /assets/provision-elasticsearch.sh']
          envFrom: [{secretRef: {name: openshell-elastic-credentials}}]
          volumeMounts:
            - {name: assets, mountPath: /assets, readOnly: true}
            - {name: assets, mountPath: /component-template.json, subPath: component-template.json, readOnly: true}
            - {name: assets, mountPath: /index-template.json, subPath: index-template.json, readOnly: true}
            - {name: assets, mountPath: /trace-component-template.json, subPath: trace-component-template.json, readOnly: true}
            - {name: assets, mountPath: /trace-index-template.json, subPath: trace-index-template.json, readOnly: true}
            - {name: assets, mountPath: /ingest-role.json, subPath: ingest-role.json, readOnly: true}
            - {name: assets, mountPath: /otlp-ingest-role.json, subPath: otlp-ingest-role.json, readOnly: true}
            - {name: assets, mountPath: /component-template-v2.json, subPath: component-template-v2.json, readOnly: true}
            - {name: assets, mountPath: /index-template-v2.json, subPath: index-template-v2.json, readOnly: true}
            - {name: assets, mountPath: /apm-ingest-pipeline.json, subPath: apm-ingest-pipeline.json, readOnly: true}
            - {name: tls, mountPath: /certs, readOnly: true}
      volumes:
        - {name: assets, configMap: {name: openshell-elastic-init-assets, defaultMode: 365}}
        - {name: tls, secret: {secretName: openshell-elastic-elasticsearch, defaultMode: 292}}
---
apiVersion: v1
kind: Service
metadata: {name: logstash, namespace: openshell-observability}
spec: {selector: {app: openshell-logstash}, ports: [{name: cloudevents, port: 8443, targetPort: cloudevents}, {name: metrics, port: 9600, targetPort: metrics}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: logstash, namespace: openshell-observability}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: openshell-logstash}}
  template:
    metadata: {labels: {app: openshell-logstash, app.kubernetes.io/part-of: openshell-soc-demo}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: logstash
          image: docker.io/library/logstash:9.4.3@sha256:52744e5617894d71fd40eb09d2235b8dcb0f744aff7a4f7c34926d77c1ad3d00
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          command: [/usr/share/logstash/openshell-entrypoint.sh]
          env: [{name: LS_JAVA_OPTS, value: -Xms512m -Xmx512m}]
          ports: [{name: cloudevents, containerPort: 8443}, {name: metrics, containerPort: 9600}]
          readinessProbe: {tcpSocket: {port: cloudevents}, initialDelaySeconds: 30, periodSeconds: 10}
          resources: {requests: {cpu: 150m, memory: 768Mi}, limits: {cpu: "2", memory: 1536Mi}}
          volumeMounts:
            - {name: config, mountPath: /usr/share/logstash/config/logstash.yml, subPath: logstash.yml, readOnly: true}
            - {name: config, mountPath: /usr/share/logstash/config/pipelines.yml, subPath: pipelines.yml, readOnly: true}
            - {name: config, mountPath: /usr/share/logstash/pipeline/openshell-cloudevents.conf, subPath: openshell-cloudevents.conf, readOnly: true}
            - {name: config, mountPath: /usr/share/logstash/transform/cloud_events.rb, subPath: cloud_events.rb, readOnly: true}
            - {name: config, mountPath: /usr/share/logstash/openshell-entrypoint.sh, subPath: entrypoint.sh, readOnly: true}
            - {name: runtime, mountPath: /run/secrets, readOnly: true}
            - {name: data, mountPath: /usr/share/logstash/data}
      volumes:
        - {name: config, configMap: {name: openshell-elastic-logstash, defaultMode: 365}}
        - name: runtime
          projected:
            defaultMode: 288
            sources:
              - secret: {name: openshell-elastic-logstash-server, items: [{key: ca.crt, path: ca.crt}, {key: tls.crt, path: logstash-server.crt}, {key: tls.key, path: logstash-server.key}]}
              - secret: {name: openshell-elastic-credentials, items: [{key: ELASTIC_INGEST_PASSWORD, path: elasticsearch-password}]}
        - {name: data, persistentVolumeClaim: {claimName: openshell-logstash-data}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: openshell-logstash-data, namespace: openshell-observability}
spec: {accessModes: [ReadWriteOnce], storageClassName: csi-hostpath-sc, resources: {requests: {storage: 2Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: apm-server, namespace: openshell-observability}
spec: {selector: {app: openshell-apm-server}, ports: [{name: otlp, port: 8200, targetPort: otlp}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: apm-server, namespace: openshell-observability}
spec:
  replicas: 1
  selector: {matchLabels: {app: openshell-apm-server}}
  template:
    metadata: {labels: {app: openshell-apm-server, app.kubernetes.io/part-of: openshell-soc-demo}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: apm-server
          image: docker.io/elastic/apm-server:9.4.3@sha256:504abe10e8ebe56edb26bc6c11cfd72323b4a43fb8d9f43e6aa9d2df4ccf1db3
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          command: [/usr/share/apm-server/openshell-entrypoint.sh]
          args: [-e, -c, /usr/share/apm-server/apm-server.yml, --strict.perms=false]
          ports: [{name: otlp, containerPort: 8200}]
          readinessProbe: {tcpSocket: {port: otlp}, initialDelaySeconds: 15, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 768Mi}}
          volumeMounts:
            - {name: config, mountPath: /usr/share/apm-server/apm-server.yml, subPath: apm-server.yml, readOnly: true}
            - {name: config, mountPath: /usr/share/apm-server/openshell-entrypoint.sh, subPath: entrypoint.sh, readOnly: true}
            - {name: runtime, mountPath: /run/secrets, readOnly: true}
      volumes:
        - {name: config, configMap: {name: openshell-elastic-apm, defaultMode: 365}}
        - name: runtime
          projected:
            defaultMode: 288
            sources:
              - secret: {name: openshell-elastic-apm-server, items: [{key: ca.crt, path: ca.crt}, {key: tls.crt, path: apm-server.crt}, {key: tls.key, path: apm-server.key}]}
              - secret: {name: openshell-elastic-credentials, items: [{key: ELASTIC_OTLP_PASSWORD, path: apm-elasticsearch-password}, {key: ELASTIC_APM_SECRET_TOKEN, path: apm-secret-token}]}
---
apiVersion: v1
kind: Service
metadata: {name: kibana, namespace: openshell-observability}
spec: {selector: {app: openshell-kibana}, ports: [{name: https, port: 5601, targetPort: https}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kibana, namespace: openshell-observability}
spec:
  replicas: 1
  selector: {matchLabels: {app: openshell-kibana}}
  template:
    metadata: {labels: {app: openshell-kibana, app.kubernetes.io/part-of: openshell-soc-demo}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: kibana
          image: docker.io/library/kibana:9.4.3@sha256:cb05cc9f3c719bd304be6252950bd1691ff6a0eec560a045f9928ed235e3fac6
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports: [{name: https, containerPort: 5601}]
          env:
            - {name: SERVER_NAME, value: kibana.openshell-observability.svc.cluster.local}
            - {name: SERVER_HOST, value: 0.0.0.0}
            - {name: SERVER_PUBLICBASEURL, value: 'https://127.0.0.1:15601'}
            - {name: SERVER_SSL_ENABLED, value: "true"}
            - {name: SERVER_SSL_CERTIFICATE, value: /usr/share/kibana/config/certs/tls.crt}
            - {name: SERVER_SSL_KEY, value: /usr/share/kibana/config/certs/tls.key}
            - {name: ELASTICSEARCH_HOSTS, value: 'https://elasticsearch:9200'}
            - {name: ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES, value: /usr/share/kibana/config/certs/ca.crt}
            - {name: ELASTICSEARCH_USERNAME, value: kibana_system}
            - {name: ELASTICSEARCH_PASSWORD, valueFrom: {secretKeyRef: {name: openshell-elastic-credentials, key: KIBANA_SYSTEM_PASSWORD}}}
            - {name: XPACK_SECURITY_ENCRYPTIONKEY, valueFrom: {secretKeyRef: {name: openshell-elastic-credentials, key: KIBANA_SECURITY_KEY}}}
            - {name: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY, valueFrom: {secretKeyRef: {name: openshell-elastic-credentials, key: KIBANA_SAVED_OBJECTS_KEY}}}
            - {name: XPACK_REPORTING_ENCRYPTIONKEY, valueFrom: {secretKeyRef: {name: openshell-elastic-credentials, key: KIBANA_REPORTING_KEY}}}
            - {name: TELEMETRY_OPTIN, value: "false"}
          readinessProbe: {httpGet: {scheme: HTTPS, path: /api/status, port: https}, initialDelaySeconds: 30, periodSeconds: 10}
          resources: {requests: {cpu: 150m, memory: 768Mi}, limits: {cpu: "2", memory: 1536Mi}}
          volumeMounts: [{name: tls, mountPath: /usr/share/kibana/config/certs, readOnly: true}]
      volumes: [{name: tls, secret: {secretName: openshell-elastic-kibana, defaultMode: 288}}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: openshell-kibana-setup, namespace: openshell-observability}
spec:
  backoffLimit: 3
  template:
    metadata: {labels: {app.kubernetes.io/part-of: openshell-soc-demo}}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 100, runAsGroup: 101, fsGroup: 101, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: setup
          image: docker.io/curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          command: [/bin/sh, /assets/provision-kibana.sh]
          env: [{name: ELASTIC_PASSWORD, valueFrom: {secretKeyRef: {name: openshell-elastic-credentials, key: ELASTIC_PASSWORD}}}]
          volumeMounts:
            - {name: assets, mountPath: /assets, readOnly: true}
            - {name: assets, mountPath: /soc-rules.ndjson, subPath: soc-rules.ndjson, readOnly: true}
            - {name: assets, mountPath: /soc-saved-objects.ndjson, subPath: soc-saved-objects.ndjson, readOnly: true}
            - {name: assets, mountPath: /soc-investigation-saved-objects.ndjson, subPath: soc-investigation-saved-objects.ndjson, readOnly: true}
            - {name: assets, mountPath: /policy-engine-saved-objects.ndjson, subPath: policy-engine-saved-objects.ndjson, readOnly: true}
            - {name: assets, mountPath: /soc-viewer-role.json, subPath: soc-viewer-role.json, readOnly: true}
            - {name: assets, mountPath: /soc-analyst-role.json, subPath: soc-analyst-role.json, readOnly: true}
            - {name: assets, mountPath: /soc-detection-engineer-role.json, subPath: soc-detection-engineer-role.json, readOnly: true}
            - {name: assets, mountPath: /soc-webhook-body.json, subPath: soc-webhook-body.json, readOnly: true}
            - {name: tls, mountPath: /certs, readOnly: true}
            - {name: detection, mountPath: /run/secrets/elastic-detection-password, subPath: ELASTIC_DETECTION_PASSWORD, readOnly: true}
      volumes:
        - {name: assets, configMap: {name: openshell-elastic-kibana-assets, defaultMode: 365}}
        - {name: tls, secret: {secretName: openshell-elastic-kibana, defaultMode: 292}}
        - {name: detection, secret: {secretName: openshell-elastic-credentials, defaultMode: 288}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: openshell-observability}
spec: {selector: {app: openshell-prometheus}, ports: [{name: http, port: 9090, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: openshell-observability}
spec:
  replicas: 1
  selector: {matchLabels: {app: openshell-prometheus}}
  template:
    metadata: {labels: {app: openshell-prometheus, app.kubernetes.io/part-of: openshell-soc-demo}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=24h]
          ports: [{name: http, containerPort: 9090}]
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          volumeMounts: [{name: config, mountPath: /etc/prometheus, readOnly: true}, {name: data, mountPath: /prometheus}]
      volumes: [{name: config, configMap: {name: openshell-prometheus-config}}, {name: data, emptyDir: {sizeLimit: 1Gi}}]
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: openshell-observability}
spec: {selector: {app: openshell-grafana}, ports: [{name: http, port: 3000, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: openshell-observability}
spec:
  replicas: 1
  selector: {matchLabels: {app: openshell-grafana}}
  template:
    metadata: {labels: {app: openshell-grafana, app.kubernetes.io/part-of: openshell-soc-demo}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 472, runAsGroup: 0, fsGroup: 472, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: GF_SERVER_ROOT_URL, value: 'http://127.0.0.1:13000'}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/openshell-exporter-operations.json}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          volumeMounts:
            - {name: dashboard, mountPath: /var/lib/grafana/dashboards, readOnly: true}
            - {name: provisioning, mountPath: /etc/grafana/provisioning, readOnly: true}
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - {name: dashboard, configMap: {name: openshell-grafana-dashboard}}
        - name: provisioning
          configMap:
            name: openshell-grafana-provisioning
            items:
              - {key: datasources.yaml, path: datasources/prometheus.yaml}
              - {key: dashboards.yaml, path: dashboards/default.yaml}
        - {name: data, emptyDir: {sizeLimit: 1Gi}}
