version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /etc, /opt/hermes, /proc/self, /dev/urandom]
  read_write: [/sandbox, /tmp, /var/log, /dev/null]
landlock:
  compatibility: best_effort
