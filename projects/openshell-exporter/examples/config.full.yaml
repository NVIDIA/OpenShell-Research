extensions:
  bearertokenauth/nemo_relay:
    token: ${env:NEMO_RELAY_OTLP_TOKEN}
  file_storage/checkpoints:
    directory: ./state/checkpoints
    create_directory: true
  file_storage/otlp_queue:
    directory: ./state/otlp-queue
    create_directory: true
  file_storage/otlphttp_queue:
    directory: ./state/otlphttp-queue
    create_directory: true
  file_storage/cloudevents_queue:
    directory: ./state/cloudevents-queue
    create_directory: true
  storagehealth:
    interval: 30s
    max_entries: 1024
    paths:
      checkpoints: ./state/checkpoints
      cloudevents_queue: ./state/cloudevents-queue
      otlp_grpc_queue: ./state/otlp-queue
      otlp_http_queue: ./state/otlphttp-queue
      recovery: ./output/openshell-events.json
  health_check:
    endpoint: 127.0.0.1:13133

receivers:
  otlp/nemo_relay:
    protocols:
      grpc:
        endpoint: ${env:NEMO_RELAY_OTLP_GRPC_LISTEN}
        auth:
          authenticator: bearertokenauth/nemo_relay
        tls:
          cert_file: ${env:NEMO_RELAY_OTLP_TLS_CERT_FILE}
          key_file: ${env:NEMO_RELAY_OTLP_TLS_KEY_FILE}
          client_ca_file: ${env:NEMO_RELAY_OTLP_CLIENT_CA_FILE}
      http:
        endpoint: ${env:NEMO_RELAY_OTLP_HTTP_LISTEN}
        auth:
          authenticator: bearertokenauth/nemo_relay
        tls:
          cert_file: ${env:NEMO_RELAY_OTLP_TLS_CERT_FILE}
          key_file: ${env:NEMO_RELAY_OTLP_TLS_KEY_FILE}
          client_ca_file: ${env:NEMO_RELAY_OTLP_CLIENT_CA_FILE}
  file_log/openshell_ocsf:
    include:
      - /var/log/openshell-ocsf.*.log
    start_at: beginning
    storage: file_storage/checkpoints
    retry_on_failure: &durable_file_retry
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    include_file_path: true
    include_file_path_resolved: true
    include_file_record_offset: true
    include_file_record_number: true
    on_truncate: read_whole_file
    max_log_size: 8MiB
    max_log_size_behavior: split
    attributes:
      openshell.acquisition.kind: ocsf.file
      openshell.acquisition.source_instance: sandbox-ocsf-jsonl
    operators:
      - type: json_parser
        parse_from: body
        parse_to: body
        on_error: send
  file_log/openshell_sandbox:
    include:
      - /var/log/openshell.*.log
    start_at: beginning
    storage: file_storage/checkpoints
    retry_on_failure: *durable_file_retry
    include_file_path: true
    include_file_path_resolved: true
    include_file_record_offset: true
    include_file_record_number: true
    on_truncate: read_whole_file
    max_log_size: 8MiB
    max_log_size_behavior: split
    attributes:
      openshell.acquisition.kind: sandbox.file_log
      openshell.acquisition.source_instance: sandbox-operational-log
  watchsandbox:
    endpoint: ${env:OPENSHELL_ENDPOINT}
    workspace: ${env:OPENSHELL_WORKSPACE}
    gateway_id: ${env:OPENSHELL_GATEWAY_ID}
    label_selector: ${env:OPENSHELL_SANDBOX_SELECTOR}
    discovery_interval: 30s
    token_env: OPENSHELL_TOKEN
    log_tail_lines: 200
    event_tail: 200
    reconnect_initial: 1s
    reconnect_max: 30s
    policy_reconciliation:
      enabled: true
      interval: 5m
      timeout: 15s
      workers: 2
      queue_size: 128
      max_revisions: 10000
      include_history: true
      include_effective_policies: false
      storage: file_storage/checkpoints
    tls:
      ca_file: ${env:OPENSHELL_CA_FILE}
      cert_file: ${env:OPENSHELL_CLIENT_CERT_FILE}
      key_file: ${env:OPENSHELL_CLIENT_KEY_FILE}

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  openshell:
    source_profiles: [ocsf.file, openshell.log, watchsandbox, policy.reconciliation, nemo_relay.trace]
    gateway_id: ${env:OPENSHELL_GATEWAY_ID}
    workspace: ${env:OPENSHELL_WORKSPACE}
    source_instance: gateway-ocsf-jsonl
    default_sandbox_id: unknown
    validation:
      mode: mark
  resource/nemo_relay:
    attributes:
      - key: telemetry.source
        value: nemo_relay
        action: upsert
      - key: openshell.gateway.id
        value: ${env:OPENSHELL_GATEWAY_ID}
        action: upsert
      - key: openshell.workspace
        value: ${env:OPENSHELL_WORKSPACE}
        action: upsert
  relay:
    gateway_id: ${env:OPENSHELL_GATEWAY_ID}
    workspace: ${env:OPENSHELL_WORKSPACE}
    privacy:
      mode: allow
exporters:
  otlp:
    endpoint: ${env:OTLP_GRPC_ENDPOINT}
    headers:
      authorization: Bearer ${env:OTLP_EXPORT_TOKEN}
    tls:
      ca_file: ${env:OTLP_CA_FILE}
      cert_file: ${env:OTLP_CLIENT_CERT_FILE}
      key_file: ${env:OTLP_CLIENT_KEY_FILE}
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage/otlp_queue
      queue_size: 10000
      num_consumers: 4
      block_on_overflow: true
      batch: &destination_queue_batch
        flush_timeout: 1s
        min_size: 512
        max_size: 1024
        sizer: items
  otlphttp:
    endpoint: ${env:OTLP_HTTP_ENDPOINT}
    headers:
      authorization: Bearer ${env:OTLP_EXPORT_TOKEN}
    tls:
      ca_file: ${env:OTLP_CA_FILE}
      cert_file: ${env:OTLP_CLIENT_CERT_FILE}
      key_file: ${env:OTLP_CLIENT_KEY_FILE}
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage/otlphttp_queue
      queue_size: 10000
      num_consumers: 4
      block_on_overflow: true
      batch: *destination_queue_batch
  cloudevents:
    endpoint: ${env:OPENSHELL_EXPORT_URL}
    max_events: 500
    max_event_bytes: 1048576
    max_request_bytes: 4194304
    headers:
      Authorization: Bearer ${env:OPENSHELL_EXPORT_TOKEN}
    tls:
      ca_file: ${env:OPENSHELL_EXPORT_CA_FILE}
      cert_file: ${env:OPENSHELL_EXPORT_CLIENT_CERT_FILE}
      key_file: ${env:OPENSHELL_EXPORT_CLIENT_KEY_FILE}
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage/cloudevents_queue
      queue_size: 10000
      num_consumers: 4
      block_on_overflow: true
      batch: *destination_queue_batch
  file/archive:
    path: ./output/openshell-events.json
    format: json

service:
  telemetry:
    logs:
      encoding: json
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
  extensions:
    - bearertokenauth/nemo_relay
    - file_storage/checkpoints
    - file_storage/otlp_queue
    - file_storage/otlphttp_queue
    - file_storage/cloudevents_queue
    - storagehealth
    - health_check
  pipelines:
    logs/files:
      receivers:
        - file_log/openshell_ocsf
        - file_log/openshell_sandbox
      processors:
        - memory_limiter
        - openshell
      exporters:
        - otlp
        - otlphttp
        - cloudevents
        - file/archive
    logs/watchsandbox:
      receivers:
        - watchsandbox
      processors:
        - memory_limiter
        - openshell
      exporters:
        - otlp
        - otlphttp
        - cloudevents
        - file/archive
    traces/nemo_relay:
      receivers:
        - otlp/nemo_relay
      processors:
        - memory_limiter
        - resource/nemo_relay
        - relay
      exporters:
        - otlp
        - otlphttp
