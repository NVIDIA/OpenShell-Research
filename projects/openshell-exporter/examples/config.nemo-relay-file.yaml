extensions:
  file_storage/checkpoints:
    directory: ./state/checkpoints
    create_directory: true
  file_storage/cloudevents_queue:
    directory: ./state/cloudevents-queue
    create_directory: true
  storagehealth:
    interval: 30s
    max_entries: 1024
    paths:
      checkpoints: ./state/checkpoints
      cloudevents_queue: ./state/cloudevents-queue
      recovery: ./output/nemo-relay-events.json
  health_check:
    endpoint: 127.0.0.1:13133

receivers:
  # Opt-in only. The glob must match NeMo Relay operational JSONL files and
  # must not overlap another tailer.
  file_log/nemo_relay:
    include:
      - "${env:NEMO_RELAY_LOG_GLOB}"
    start_at: beginning
    storage: file_storage/checkpoints
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    include_file_path: true
    include_file_path_resolved: true
    include_file_record_offset: true
    include_file_record_number: true
    on_truncate: read_whole_file
    max_log_size: 8MiB
    max_log_size_behavior: split
    attributes:
      openshell.acquisition.kind: nemo_relay.log
      openshell.acquisition.source_instance: nemo-relay-file
    operators:
      - type: json_parser
        parse_from: body
        parse_to: body
        on_error: send

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  openshell:
    source_profiles: [nemo_relay.log]
    gateway_id: ${env:OPENSHELL_GATEWAY_ID}
    workspace: ${env:OPENSHELL_WORKSPACE}
    source_instance: nemo-relay-file
    default_sandbox_id: relay-unattributed
    validation:
      mode: mark
exporters:
  cloudevents:
    endpoint: ${env:OPENSHELL_EXPORT_URL}
    timeout: 15s
    max_events: 500
    max_event_bytes: 1048576
    max_request_bytes: 4194304
    tls:
      ca_file: ${env:OPENSHELL_EXPORT_CA_FILE}
      cert_file: ${env:OPENSHELL_EXPORT_CLIENT_CERT_FILE}
      key_file: ${env:OPENSHELL_EXPORT_CLIENT_KEY_FILE}
    headers:
      Authorization: Bearer ${env:OPENSHELL_EXPORT_TOKEN}
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage/cloudevents_queue
      queue_size: 10000
      num_consumers: 4
      block_on_overflow: true
      batch:
        flush_timeout: 1s
        min_size: 512
        max_size: 1024
        sizer: items
  file/archive:
    path: ./output/nemo-relay-events.json
    format: json

service:
  telemetry:
    logs:
      encoding: json
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
  extensions:
    - file_storage/checkpoints
    - file_storage/cloudevents_queue
    - storagehealth
    - health_check
  pipelines:
    logs/nemo_relay:
      receivers:
        - file_log/nemo_relay
      processors:
        - memory_limiter
        - openshell
      exporters:
        - cloudevents
        - file/archive
