input {
  http {
    id => "openshell_cloudevents_https"
    host => "0.0.0.0"
    port => 8443
    codec => plain { charset => "UTF-8" }
    additional_codecs => {}
    ecs_compatibility => "v8"
    response_code => 204
    ssl_enabled => true
    ssl_certificate => "/run/secrets/logstash-server.crt"
    ssl_key => "/run/secrets/logstash-server.key"
    ssl_certificate_authorities => ["/run/secrets/ca.crt"]
    ssl_client_authentication => "required"
  }
}

filter {
  ruby {
    id => "openshell_cloudevents_batch_v1"
    path => "/usr/share/logstash/transform/cloud_events.rb"
  }
}

output {
  if [@metadata][openshell_route] == "security" {
    elasticsearch {
      id => "openshell_security_v2"
      hosts => ["https://elasticsearch:9200"]
      user => "openshell_ingest"
      password => "${ELASTIC_INGEST_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/run/secrets/ca.crt"]
      action => "create"
      index => "logs-openshell.security-default-v2"
      document_id => "%{[@metadata][document_id]}"
      manage_template => false
      # At-least-once replay deliberately produces create conflicts for an
      # existing (source,id). Elasticsearch drops 409s; keep the runtime log
      # focused on actionable mapping and delivery failures.
      silence_errors_in_log => ["version_conflict_engine_exception"]
    }
  } else if [@metadata][openshell_route] == "diagnostic" {
    file {
      id => "openshell_intake_diagnostics"
      path => "/usr/share/logstash/data/recovery/cloudevents-intake-diagnostics.jsonl"
      codec => json_lines {
        ecs_compatibility => "disabled"
        decode_size_limit_bytes => 4194304
      }
    }
  }
}
