extensions:
  bearertokenauth/exporter:
    filename: /run/secrets/relay-auth/token
  file_storage/relay_queue:
    directory: /var/lib/otelcol
    create_directory: false
  storagehealth:
    interval: 30s
    max_entries: 1024
    paths:
      otlp_http_queue: /var/lib/otelcol
  health_check:
    endpoint: 0.0.0.0:13134

receivers:
  otlp/relay:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
        max_request_body_size: 4194304

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 96
    spike_limit_mib: 24

exporters:
  otlp_http/exporter:
    endpoint: https://${env:OPENSHELL_EXPORTER_HOST}:4318
    auth:
      authenticator: bearertokenauth/exporter
    tls:
      ca_file: /run/secrets/relay/ca.crt
      cert_file: /run/secrets/relay/tls.crt
      key_file: /run/secrets/relay/tls.key
      min_version: "1.3"
    sending_queue:
      enabled: true
      storage: file_storage/relay_queue
      queue_size: 2048
      num_consumers: 2
      block_on_overflow: true
      batch:
        flush_timeout: 1s
        min_size: 256
        max_size: 512
        sizer: items
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s

service:
  extensions: [bearertokenauth/exporter, file_storage/relay_queue, storagehealth, health_check]
  telemetry:
    logs:
      encoding: json
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8889
  pipelines:
    traces:
      receivers: [otlp/relay]
      processors: [memory_limiter]
      exporters: [otlp_http/exporter]
