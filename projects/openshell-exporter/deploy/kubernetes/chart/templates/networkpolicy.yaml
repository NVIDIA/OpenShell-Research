{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openshell-event-exporter.fullname" . }}
  labels:
    {{- include "openshell-event-exporter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openshell-event-exporter.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.monitoringNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 13133
        - protocol: TCP
          port: 8888
    {{- if or (eq (include "openshell-event-exporter.module.relayOtlp" .) "true") (eq (include "openshell-event-exporter.module.nativeOtlp" .) "true") (eq (include "openshell-event-exporter.module.forwardedSandboxFiles" .) "true") (eq (include "openshell-event-exporter.module.internalOtlp" .) "true") }}
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.additionalSourceNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        {{- if .Values.sandboxInjection.enabled }}
        {{- range .Values.sandboxInjection.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        {{- end }}
      ports:
        {{- if eq (include "openshell-event-exporter.module.relayOtlp" .) "true" }}
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
        {{- end }}
        {{- if eq (include "openshell-event-exporter.module.nativeOtlp" .) "true" }}
        - protocol: TCP
          port: 4319
        {{- end }}
        {{- if eq (include "openshell-event-exporter.module.forwardedSandboxFiles" .) "true" }}
        - protocol: TCP
          port: 4320
        {{- end }}
        {{- if eq (include "openshell-event-exporter.module.internalOtlp" .) "true" }}
        - protocol: TCP
          port: 4330
        - protocol: TCP
          port: 4331
        {{- end }}
    {{- end }}
{{- end }}
