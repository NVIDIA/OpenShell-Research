{{- if and (eq (include "openshell-event-exporter.module.cloudEvents" .) "true") (not .Values.persistence.queue.existingClaim) (ne (include "openshell-event-exporter.centralStateful" .) "true") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "openshell-event-exporter.queueClaim" . }}
  labels:
    {{- include "openshell-event-exporter.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: {{ toYaml .Values.persistence.queue.accessModes | nindent 4 }}
  {{- if eq .Values.persistence.queue.storageClass "-" }}
  storageClassName: ""
  {{- else if .Values.persistence.queue.storageClass }}
  storageClassName: {{ .Values.persistence.queue.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.queue.size }}
---
{{- end }}
{{- if and (eq (include "openshell-event-exporter.module.recovery" .) "true") (not .Values.persistence.recovery.existingClaim) (ne (include "openshell-event-exporter.centralStateful" .) "true") }}
