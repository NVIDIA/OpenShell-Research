{{- if .Values.sandboxInjection.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openshell-event-exporter.fullname" . }}-injector
  labels:
    app.kubernetes.io/name: {{ include "openshell-event-exporter.name" . }}-injector
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sandbox-injector
spec:
  replicas: {{ .Values.sandboxInjection.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "openshell-event-exporter.name" . }}-injector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "openshell-event-exporter.name" . }}-injector
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: sandbox-injector
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: injector
          image: {{ include "openshell-event-exporter.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/sandbox-injector"]
          env:
            - name: SANDBOX_INJECTOR_ALLOWED_NAMESPACES
              value: {{ join "," .Values.sandboxInjection.allowedNamespaces | quote }}
            - name: SANDBOX_INJECTOR_ALLOWED_USERNAMES
              value: {{ join "," .Values.sandboxInjection.allowedGatewayUsernames | quote }}
            - name: SANDBOX_INJECTOR_FLUENT_BIT_IMAGE
              value: {{ printf "%s@%s" .Values.sandboxInjection.fluentBit.repository .Values.sandboxInjection.fluentBit.digest | quote }}
            - name: SANDBOX_INJECTOR_EXPORTER_HOST
              value: {{ printf "%s.%s.svc.cluster.local" (include "openshell-event-exporter.fullname" .) .Release.Namespace | quote }}
            - name: SANDBOX_INJECTOR_GATEWAY_ID
              value: {{ .Values.source.gatewayId | quote }}
            - name: SANDBOX_INJECTOR_WORKSPACE
              value: {{ .Values.source.workspace | quote }}
            - name: SANDBOX_INJECTOR_AGENT_CONFIG_MAP
              value: {{ printf "%s-forwarder-agent" (include "openshell-event-exporter.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
            - name: SANDBOX_INJECTOR_NETWORK_CONFIG_MAP
              value: {{ printf "%s-forwarder-network" (include "openshell-event-exporter.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
            - name: SANDBOX_INJECTOR_FORWARDER_TLS_SECRET
              value: {{ .Values.sandboxInjection.forwarderTLSSecret | quote }}
            - name: SANDBOX_INJECTOR_FORWARDER_AUTH_SECRET
              value: {{ .Values.sandboxInjection.forwarderAuthSecret | quote }}
            - name: SANDBOX_INJECTOR_EVIDENCE_SIZE
              value: {{ .Values.sandboxInjection.evidencePersistence.size | quote }}
            - name: SANDBOX_INJECTOR_EVIDENCE_STORAGE_CLASS
              value: {{ .Values.sandboxInjection.evidencePersistence.storageClass | quote }}
            - name: SANDBOX_INJECTOR_STATE_SIZE
              value: {{ .Values.sandboxInjection.statePersistence.size | quote }}
            - name: SANDBOX_INJECTOR_STATE_STORAGE_CLASS
              value: {{ .Values.sandboxInjection.statePersistence.storageClass | quote }}
            - name: SANDBOX_INJECTOR_CPU_REQUEST
              value: {{ .Values.sandboxInjection.fluentBit.resources.requests.cpu | quote }}
            - name: SANDBOX_INJECTOR_MEMORY_REQUEST
              value: {{ .Values.sandboxInjection.fluentBit.resources.requests.memory | quote }}
            - name: SANDBOX_INJECTOR_CPU_LIMIT
              value: {{ .Values.sandboxInjection.fluentBit.resources.limits.cpu | quote }}
            - name: SANDBOX_INJECTOR_MEMORY_LIMIT
              value: {{ .Values.sandboxInjection.fluentBit.resources.limits.memory | quote }}
            - name: SANDBOX_INJECTOR_TLS_CERT_FILE
              value: /run/secrets/webhook/tls.crt
            - name: SANDBOX_INJECTOR_TLS_KEY_FILE
              value: /run/secrets/webhook/tls.key
          ports:
            - name: webhook
              containerPort: 9443
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.sandboxInjection.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: webhook
            periodSeconds: 5
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: webhook
            periodSeconds: 30
          volumeMounts:
            - name: webhook-tls
              mountPath: /run/secrets/webhook
              readOnly: true
      volumes:
        - name: webhook-tls
          secret:
            secretName: {{ .Values.sandboxInjection.webhookTLSSecret }}
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openshell-event-exporter.fullname" . }}-injector
  labels:
    app.kubernetes.io/name: {{ include "openshell-event-exporter.name" . }}-injector
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "openshell-event-exporter.name" . }}-injector
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: https
      port: 443
      targetPort: webhook
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "openshell-event-exporter.fullname" . }}-sandbox-evidence
  {{- if .Values.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ printf "%s/%s" .Release.Namespace (printf "%s-injector" (include "openshell-event-exporter.fullname" .) | trunc 63 | trimSuffix "-") | quote }}
  {{- end }}
  labels:
    {{- include "openshell-event-exporter.labels" . | nindent 4 }}
webhooks:
  - name: evidence-injector.openshell.nvidia.com
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    reinvocationPolicy: Never
    timeoutSeconds: 5
    namespaceSelector:
      matchLabels:
        {{ .Values.sandboxInjection.namespaceSelector.labelKey }}: {{ .Values.sandboxInjection.namespaceSelector.labelValue | quote }}
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ include "openshell-event-exporter.fullname" . }}-injector
        path: /mutate
        port: 443
      {{- if not .Values.certManager.enabled }}
      caBundle: {{ required "sandboxInjection.webhookCABundle is required when injection is enabled without cert-manager" .Values.sandboxInjection.webhookCABundle | quote }}
      {{- end }}
    rules:
      - operations: [CREATE]
        apiGroups: [agents.x-k8s.io]
        apiVersions: [v1beta1, v1alpha1]
        resources: [sandboxes]
        scope: Namespaced
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openshell-event-exporter.fullname" . }}-injector
  labels:
    app.kubernetes.io/name: {{ include "openshell-event-exporter.name" . }}-injector
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "openshell-event-exporter.name" . }}-injector
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {protocol: TCP, port: 9443}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
{{- end }}
