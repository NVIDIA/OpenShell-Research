{{- if .Values.sandboxInjection.enabled }}
{{- range $index, $namespace := .Values.sandboxInjection.allowedNamespaces }}
{{- if $index }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-forwarder-agent" (include "openshell-event-exporter.fullname" $) | trunc 63 | trimSuffix "-" }}
  namespace: {{ $namespace }}
  labels:
    {{- include "openshell-event-exporter.labels" $ | nindent 4 }}
    app.kubernetes.io/component: sandbox-forwarder
    observability.openshell.nvidia.com/file-profile: agent-only
data:
  fluent-bit.conf: |
{{ $.Files.Get "files/fluent-bit.conf" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-forwarder-network" (include "openshell-event-exporter.fullname" $) | trunc 63 | trimSuffix "-" }}
  namespace: {{ $namespace }}
  labels:
    {{- include "openshell-event-exporter.labels" $ | nindent 4 }}
    app.kubernetes.io/component: sandbox-forwarder
    observability.openshell.nvidia.com/file-profile: agent-and-network
data:
  fluent-bit.conf: |
{{ $.Files.Get "files/fluent-bit-network.conf" | indent 4 }}
{{- end }}
{{- end }}
