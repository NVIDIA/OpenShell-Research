extensions:
  bearertokenauth/internal:
    filename: ${env:INTERNAL_OTLP_TOKEN_FILE}
{{- if eq (include "openshell-event-exporter.module.cloudEvents" .) "true" }}
  bearertokenauth/destination:
    filename: ${env:DESTINATION_TOKEN_FILE_INTERNAL}
  file_storage/cloudevents_queue:
    directory: ${env:EXPORTER_QUEUE_DIR}
    create_directory: false
{{- end }}
{{- if or (eq (include "openshell-event-exporter.module.otlpGrpc" .) "true") (eq (include "openshell-event-exporter.module.otlpHttp" .) "true") }}
  bearertokenauth/otlp_destination:
    filename: ${env:OTLP_DESTINATION_TOKEN_FILE}
{{- end }}
{{- if eq (include "openshell-event-exporter.module.otlpGrpc" .) "true" }}
  file_storage/otlp_queue:
    directory: ${env:EXPORTER_OTLP_GRPC_QUEUE_DIR}
    create_directory: false
{{- end }}
{{- if eq (include "openshell-event-exporter.module.otlpHttp" .) "true" }}
  file_storage/otlphttp_queue:
    directory: ${env:EXPORTER_OTLP_HTTP_QUEUE_DIR}
    create_directory: false
{{- end }}
  storagehealth:
    interval: 30s
    max_entries: 1024
    paths:
{{- if eq (include "openshell-event-exporter.module.cloudEvents" .) "true" }}
      cloudevents_queue: ${env:EXPORTER_QUEUE_DIR}
{{- end }}
{{- if eq (include "openshell-event-exporter.module.otlpGrpc" .) "true" }}
      otlp_grpc_queue: ${env:EXPORTER_OTLP_GRPC_QUEUE_DIR}
{{- end }}
{{- if eq (include "openshell-event-exporter.module.otlpHttp" .) "true" }}
      otlp_http_queue: ${env:EXPORTER_OTLP_HTTP_QUEUE_DIR}
{{- end }}
{{- if eq (include "openshell-event-exporter.module.recovery" .) "true" }}
      recovery: ${env:EXPORTER_RECOVERY_FILE}
{{- end }}
  health_check:
    endpoint: ${env:EXPORTER_HEALTH_ENDPOINT}

receivers:
  otlp/internal:
    protocols:
      grpc:
        endpoint: ${env:INTERNAL_OTLP_GRPC_LISTEN}
        auth:
          authenticator: bearertokenauth/internal
        tls:
          cert_file: ${env:INTERNAL_OTLP_TLS_CERT_FILE}
          key_file: ${env:INTERNAL_OTLP_TLS_KEY_FILE}
          client_ca_file: ${env:INTERNAL_OTLP_CLIENT_CA_FILE}
          client_ca_file_reload: true
          reload_interval: 1m
      http:
        endpoint: ${env:INTERNAL_OTLP_HTTP_LISTEN}
        auth:
          authenticator: bearertokenauth/internal
        tls:
          cert_file: ${env:INTERNAL_OTLP_TLS_CERT_FILE}
          key_file: ${env:INTERNAL_OTLP_TLS_KEY_FILE}
          client_ca_file: ${env:INTERNAL_OTLP_CLIENT_CA_FILE}
          client_ca_file_reload: true
          reload_interval: 1m

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  evidencecontract/verify:
    mode: verify
    contract_version: "1.0"
    tenant_id: {{ .Values.topology.tenantId | quote }}

exporters:
{{- if eq (include "openshell-event-exporter.module.otlpGrpc" .) "true" }}
  otlp:
    endpoint: ${env:OTLP_GRPC_ENDPOINT}
    auth:
      authenticator: bearertokenauth/otlp_destination
    tls:
      ca_file: ${env:OTLP_CA_FILE}
      cert_file: ${env:OTLP_CLIENT_CERT_FILE}
      key_file: ${env:OTLP_CLIENT_KEY_FILE}
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage/otlp_queue
      queue_size: 10000
      num_consumers: 4
      block_on_overflow: true
{{- end }}
{{- if eq (include "openshell-event-exporter.module.otlpHttp" .) "true" }}
  otlphttp:
    endpoint: ${env:OTLP_HTTP_ENDPOINT}
    auth:
      authenticator: bearertokenauth/otlp_destination
    tls:
      ca_file: ${env:OTLP_CA_FILE}
      cert_file: ${env:OTLP_CLIENT_CERT_FILE}
      key_file: ${env:OTLP_CLIENT_KEY_FILE}
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage/otlphttp_queue
      queue_size: 10000
      num_consumers: 4
      block_on_overflow: true
{{- end }}
{{- if eq (include "openshell-event-exporter.module.cloudEvents" .) "true" }}
  cloudevents:
    endpoint: ${env:OPENSHELL_EXPORT_URL}
    timeout: 15s
    max_events: 500
    max_event_bytes: 1048576
    max_request_bytes: 4194304
    auth:
      authenticator: bearertokenauth/destination
    tls:
      ca_file: ${env:DESTINATION_CA_FILE_INTERNAL}
      cert_file: ${env:DESTINATION_CLIENT_CERT_FILE}
      key_file: ${env:DESTINATION_CLIENT_KEY_FILE}
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage/cloudevents_queue
      queue_size: 10000
      num_consumers: 4
      block_on_overflow: true
{{- end }}
{{- if eq (include "openshell-event-exporter.module.recovery" .) "true" }}
  file/recovery:
    path: ${env:EXPORTER_RECOVERY_FILE}
    format: json
{{- end }}

service:
  telemetry:
    logs:
      encoding: json
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: ${env:EXPORTER_METRICS_HOST}
                port: 8888
  extensions:
    - bearertokenauth/internal
{{- if eq (include "openshell-event-exporter.module.cloudEvents" .) "true" }}
    - bearertokenauth/destination
    - file_storage/cloudevents_queue
{{- end }}
{{- if or (eq (include "openshell-event-exporter.module.otlpGrpc" .) "true") (eq (include "openshell-event-exporter.module.otlpHttp" .) "true") }}
    - bearertokenauth/otlp_destination
{{- end }}
{{- if eq (include "openshell-event-exporter.module.otlpGrpc" .) "true" }}
    - file_storage/otlp_queue
{{- end }}
{{- if eq (include "openshell-event-exporter.module.otlpHttp" .) "true" }}
    - file_storage/otlphttp_queue
{{- end }}
    - storagehealth
    - health_check
  pipelines:
    logs/internal:
      receivers: [otlp/internal]
      processors: [memory_limiter, evidencecontract/verify]
      exporters: [{{ include "openshell-event-exporter.logExporters" . }}]
{{- if or (eq (include "openshell-event-exporter.module.otlpGrpc" .) "true") (eq (include "openshell-event-exporter.module.otlpHttp" .) "true") }}
    traces/internal:
      receivers: [otlp/internal]
      processors: [memory_limiter, evidencecontract/verify]
      exporters: [{{ include "openshell-event-exporter.traceExporters" . }}]
{{- end }}
