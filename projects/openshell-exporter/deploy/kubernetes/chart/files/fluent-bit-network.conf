[SERVICE]
    Flush                     1
    Grace                     20
    Log_Level                 info
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    Health_Check              On
    HC_Errors_Count           5
    HC_Retry_Failure_Count    5
    HC_Period                 60
    storage.path              /var/lib/fluent-bit/storage
    storage.sync              full
    storage.checksum          on
    storage.backlog.flush_on_shutdown on
    storage.delete_irrecoverable_chunks off

[INPUT]
    Name                      tail
    Tag                       openshell.ocsf.agent
    Path                      /evidence/agent/openshell-ocsf.*.log
    DB                        /var/lib/fluent-bit/ocsf-agent.db
    DB.Sync                   Full
    Read_from_Head            On
    Rotate_Wait               30
    Refresh_Interval          5
    Skip_Long_Lines           Off
    Buffer_Chunk_Size         256K
    Buffer_Max_Size           8M
    Path_Key                  log.file.path
    Offset_Key                log.file.record_offset
    storage.type              filesystem

[INPUT]
    Name                      tail
    Tag                       openshell.log.agent
    Path                      /evidence/agent/openshell.*.log
    DB                        /var/lib/fluent-bit/log-agent.db
    DB.Sync                   Full
    Read_from_Head            On
    Rotate_Wait               30
    Refresh_Interval          5
    Skip_Long_Lines           Off
    Buffer_Chunk_Size         256K
    Buffer_Max_Size           8M
    Path_Key                  log.file.path
    Offset_Key                log.file.record_offset
    storage.type              filesystem

[INPUT]
    Name                      tail
    Tag                       openshell.ocsf.network
    Path                      /evidence/network/openshell-ocsf.*.log
    DB                        /var/lib/fluent-bit/ocsf-network.db
    DB.Sync                   Full
    Read_from_Head            On
    Rotate_Wait               30
    Refresh_Interval          5
    Skip_Long_Lines           Off
    Buffer_Chunk_Size         256K
    Buffer_Max_Size           8M
    Path_Key                  log.file.path
    Offset_Key                log.file.record_offset
    storage.type              filesystem

[INPUT]
    Name                      tail
    Tag                       openshell.log.network
    Path                      /evidence/network/openshell.*.log
    DB                        /var/lib/fluent-bit/log-network.db
    DB.Sync                   Full
    Read_from_Head            On
    Rotate_Wait               30
    Refresh_Interval          5
    Skip_Long_Lines           Off
    Buffer_Chunk_Size         256K
    Buffer_Max_Size           8M
    Path_Key                  log.file.path
    Offset_Key                log.file.record_offset
    storage.type              filesystem

[INPUT]
    Name                      dummy
    Tag                       openshell.capability
    Dummy                     {"log":"agent and network file evidence lanes enabled: openshell-supervisor-network container detected"}
    Samples                   1

[FILTER]
    Name                      record_modifier
    Match                     openshell.ocsf.*
    Record                    openshell.acquisition.kind ocsf.forwarded
    Record                    openshell.acquisition.source_instance ${OPENSHELL_SOURCE_INSTANCE}/fluent-bit
    Record                    openshell.gateway.id ${OPENSHELL_GATEWAY_ID}
    Record                    openshell.workspace ${OPENSHELL_WORKSPACE}
    Record                    openshell.sandbox.id ${OPENSHELL_SANDBOX_ID}

[FILTER]
    Name                      record_modifier
    Match                     openshell.log.*
    Record                    openshell.acquisition.kind openshell.log.forwarded
    Record                    openshell.acquisition.source_instance ${OPENSHELL_SOURCE_INSTANCE}/fluent-bit
    Record                    openshell.gateway.id ${OPENSHELL_GATEWAY_ID}
    Record                    openshell.workspace ${OPENSHELL_WORKSPACE}
    Record                    openshell.sandbox.id ${OPENSHELL_SANDBOX_ID}

[FILTER]
    Name                      record_modifier
    Match                     openshell.capability
    Record                    openshell.acquisition.kind source.capability
    Record                    openshell.acquisition.source_instance ${OPENSHELL_SOURCE_INSTANCE}/fluent-bit
    Record                    openshell.acquisition.transport otlp_http
    Record                    openshell.acquisition.payload_type openshell.exporter.source_capability.v1
    Record                    openshell.gateway.id ${OPENSHELL_GATEWAY_ID}
    Record                    openshell.workspace ${OPENSHELL_WORKSPACE}
    Record                    openshell.sandbox.id ${OPENSHELL_SANDBOX_ID}
    Record                    openshell.event.kind source_capability
    Record                    openshell.source.agent_file_lane enabled
    Record                    openshell.source.network_file_lane enabled
    Record                    openshell.source.reason network_container_detected

[OUTPUT]
    Name                      opentelemetry
    Match                     openshell.*
    Host                      ${OPENSHELL_EXPORTER_HOST}
    Port                      4320
    Logs_uri                  /v1/logs
    Logs_Body_Key             log
    Logs_Body_Key_Attributes  On
    Header                    Authorization Bearer ${FORWARDED_OCSF_TOKEN}
    Compress                  gzip
    Retry_Limit               no_limits
    storage.total_limit_size  1G
    Tls                       On
    Tls.Verify                On
    Tls.Verify_Hostname       On
    Tls.Ca_File               /run/secrets/exporter/ca.crt
    Tls.Crt_File              /run/secrets/exporter/tls.crt
    Tls.Key_File              /run/secrets/exporter/tls.key
