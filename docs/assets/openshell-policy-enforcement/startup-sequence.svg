<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" aria-labelledby="title desc">
  <title id="title">The boundary is established before the workload starts</title>
  <desc id="desc">First the supervisor loads policy and prepares networking. Before executing the requested program, the child enters its namespaces, drops privileges, and activates Landlock and seccomp. The requested program and later descendants run with the inherited restrictions. This diagram groups the setup steps rather than specifying individual system-call order.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202a21; }
      .heading { font-size: 25px; font-weight: 650; }
      .label { font-size: 21px; font-weight: 600; }
      .body { font-size: 18px; fill: #52604f; }
      .eyebrow { font-size: 15px; font-weight: 650; letter-spacing: 1.5px; fill: #53664a; }
      .number { font-size: 18px; font-weight: 600; fill: #fff; }
      .flow { fill: none; stroke: #74816f; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#74816f" stroke-width="1.5"/></marker>
  </defs>
  <rect width="720" height="640" rx="18" fill="#fcfdf9"/>
  <text class="eyebrow" x="32" y="35">02 / BEFORE EXECUTION</text>
  <text class="heading" x="32" y="72">The program starts inside the restrictions.</text>

  <path class="flow" d="M65 174 V209"/>
  <path class="flow" d="M65 383 V474"/>

  <rect x="100" y="104" width="588" height="91" rx="12" fill="#fff" stroke="#d0d8cb"/>
  <circle cx="65" cy="149" r="21" fill="#58684e"/>
  <text class="number" x="65" y="156" text-anchor="middle">1</text>
  <text class="label" x="123" y="136">Supervisor prepares the environment</text>
  <text class="body" x="123" y="166">Load policy · configure networking and proxy</text>

  <rect x="100" y="221" width="588" height="183" rx="12" fill="#f3f5ef" stroke="#abb8a1"/>
  <circle cx="65" cy="245" r="21" fill="#58684e"/>
  <text class="number" x="65" y="252" text-anchor="middle">2</text>
  <text class="label" x="123" y="255">Child setup, before the requested program</text>
  <text class="body" x="123" y="292">Enter isolated namespaces</text>
  <text class="body" x="123" y="322">Drop privileges and prevent privilege regain</text>
  <text class="body" x="123" y="352">Activate Landlock and seccomp</text>
  <text class="body" x="123" y="382">Complete the required setup</text>

  <path d="M100 446 H688" stroke="#72964d" stroke-width="1.5" stroke-dasharray="5 5"/>
  <rect x="277" y="430" width="235" height="30" fill="#fcfdf9"/>
  <text class="eyebrow" x="395" y="451" text-anchor="middle">EXECUTE THE PROGRAM</text>

  <rect x="100" y="486" width="588" height="119" rx="12" fill="#eaf2df" stroke="#72964d" stroke-width="2"/>
  <circle cx="65" cy="509" r="21" fill="#456d17"/>
  <text class="number" x="65" y="516" text-anchor="middle">3</text>
  <text class="label" x="123" y="520">Agent runs with restrictions in place</text>
  <text class="body" x="123" y="552">A new executable does not reset the boundary.</text>
  <text class="body" x="123" y="582">Later child processes inherit the restrictions.</text>
</svg>
