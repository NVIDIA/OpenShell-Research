<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 95 1280 690" role="img" aria-labelledby="title desc">
<title id="title">Recommended permission review and runtime enforcement workflow</title><desc id="desc">The operator establishes a starting policy, task purpose and protected maximum. The agent requests access through OpenShell Policy Advisor. A human or AI reviewer judges necessity; an operator gate uses the OpenShell prover on the complete effective candidate. Both approvals are required before exact reviewed inputs can be activated and their application confirmed. A retry passes supervisor policy, egress middleware and credential binding before reaching the service. Behavior monitoring, drift detection, trusted evidence and stopping remain active. Unsupported or inconclusive proof withholds the grant. This is a recommended integration, not a native turnkey workflow or host-containment proof.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#579000"/></marker>
<style>
.section { font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#475569; letter-spacing:.06em; }
.label { font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#111827; }
.small { font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#475569; }
.tiny { font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#475569; }
.heading { font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#111827; }
.box { fill:#fff; stroke:#cbd5e1; stroke-width:2; }
.soft { fill:#f8fafc; stroke:#cbd5e1; stroke-width:2; }
.green { fill:#f2f9e8; stroke:#76b900; stroke-width:2.5; }
.trusted { fill:#eff6ff; stroke:#3b82f6; stroke-width:2.5; }
.dark { fill:#1f2937; stroke:#111827; stroke-width:2; }
.line { fill:none; stroke:#334155; stroke-width:2.5; marker-end:url(#arrow); }
.flow { fill:none; stroke:#579000; stroke-width:3; marker-end:url(#arrow-green); }
.blocked { fill:none; stroke:#c2413b; stroke-width:2.5; stroke-dasharray:8 7; }
</style></defs>
<rect width="1280" height="835" rx="20" fill="#fff"/>


<rect x="40" y="115" width="440" height="95" rx="14" class="soft" />
<text x="60" y="146" text-anchor="start" class="tiny" >OPERATOR-DETERMINED TASK</text>
<text x="60" y="177" text-anchor="start" class="label" >Starting policy + authorized purpose</text>
<text x="60" y="198" text-anchor="start" class="small" >Context for review; agent claims remain untrusted.</text>
<rect x="520" y="115" width="680" height="95" rx="14" class="green" />
<text x="540" y="146" text-anchor="start" class="tiny" >OPERATOR-CONTROLLED MAXIMUM</text>
<text x="540" y="177" text-anchor="start" class="label" >The agent and reviewer cannot widen this boundary.</text>
<text x="540" y="198" text-anchor="start" class="small" >Protect the ceiling and gate every policy mutation path.</text>
<path d="M 860 210 V 280" class="line"/>
<text x="880" y="247" text-anchor="start" class="tiny" >BOUNDARY INPUT</text>
<rect x="40" y="280" width="200" height="125" rx="14" class="dark" />
<text x="140" y="314" text-anchor="middle" class="label" style="fill:#fff">Agent</text>
<text x="140" y="346" text-anchor="middle" class="small" style="fill:#d1d5db">Requests narrow access</text>
<text x="140" y="374" text-anchor="middle" class="small" style="fill:#d1d5db">for the task</text>
<rect x="280" y="280" width="200" height="125" rx="14" class="trusted" />
<text x="380" y="314" text-anchor="middle" class="label" >Policy Advisor</text>
<text x="380" y="346" text-anchor="middle" class="small" >Validates proposal</text>
<text x="380" y="374" text-anchor="middle" class="small" >Reports added risk</text>
<rect x="520" y="280" width="200" height="125" rx="14" class="green" />
<text x="620" y="314" text-anchor="middle" class="label" >Reviewer</text>
<text x="620" y="346" text-anchor="middle" class="small" >Human or AI via SDK</text>
<text x="620" y="374" text-anchor="middle" class="small" >Judges task necessity</text>
<rect x="760" y="280" width="200" height="125" rx="14" class="green" />
<text x="860" y="314" text-anchor="middle" class="label" >Ceiling gate</text>
<text x="860" y="346" text-anchor="middle" class="small" >OpenShell prover</text>
<text x="860" y="374" text-anchor="middle" class="small" >Full effective candidate</text>
<rect x="1000" y="280" width="200" height="125" rx="14" class="trusted" />
<text x="1100" y="314" text-anchor="middle" class="label" >Activate policy</text>
<text x="1100" y="346" text-anchor="middle" class="small" >Exact reviewed inputs</text>
<text x="1100" y="374" text-anchor="middle" class="small" >Confirm policy loaded</text>
<path d="M 240 342 H 280" class="line"/>
<path d="M 480 342 H 520" class="line"/>
<path d="M 720 342 H 760" class="line"/>
<path d="M 960 342 H 1000" class="line"/>
<text x="40" y="439" text-anchor="start" class="small" >Rejected, stale or unproven candidates do not activate.</text>
<path d="M 1100 405 V 470 H 25 V 590 H 65" class="flow"/>
<text x="40" y="501" text-anchor="start" class="tiny" >EVERY RETRIED REQUEST STILL PASSES THROUGH RUNTIME CONTROLS</text>
<rect x="40" y="520" width="1160" height="145" rx="14" class="soft" />
<rect x="65" y="540" width="250" height="100" rx="14" class="trusted" />
<text x="190" y="578" text-anchor="middle" class="label" >Supervisor policy</text>
<text x="190" y="609" text-anchor="middle" class="small" >Is this request allowed?</text>
<rect x="355" y="540" width="250" height="100" rx="14" class="green" />
<text x="480" y="578" text-anchor="middle" class="label" >Egress watchdog</text>
<text x="480" y="609" text-anchor="middle" class="small" >Inspect + enforce limits</text>
<rect x="645" y="540" width="250" height="100" rx="14" class="trusted" />
<text x="770" y="578" text-anchor="middle" class="label" >Credential binding</text>
<text x="770" y="609" text-anchor="middle" class="small" >Supervisor attaches secret</text>
<rect x="935" y="540" width="240" height="100" rx="14" class="box" />
<text x="1055" y="578" text-anchor="middle" class="label" >Allowed service</text>
<text x="1055" y="609" text-anchor="middle" class="small" >Task-scoped operation</text>
<path d="M 315 590 H 355" class="flow"/>
<path d="M 605 590 H 645" class="flow"/>
<path d="M 895 590 H 935" class="flow"/>
<rect x="40" y="695" width="1160" height="70" rx="14" class="green" />
<text x="60" y="724" text-anchor="start" class="label" >Throughout the run</text>
<text x="60" y="750" text-anchor="start" class="small" >Behavior monitoring · policy and provider drift checks · trusted evidence · independent stop path</text>

