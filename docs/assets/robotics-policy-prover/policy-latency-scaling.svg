<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Policy-prover latency scaling benchmark</title>
<desc id="desc">The top chart shows measured p50, p95, and p99 policy-decision latency for allow, deny, and constrain outcomes across three to forty-eight waypoints. The lower chart shows the slowest measured p95 policy latency as a percentage of several illustrative agent inference scenarios.</desc>
<style>
.bg{fill:#f7f8fa}.panel{fill:#fff;stroke:#d0d5dd;stroke-width:1.5}.grid{stroke:#eaecf0;stroke-width:1}.axis{stroke:#98a2b3;stroke-width:1.5}.title{font:700 25px Inter,system-ui,sans-serif;fill:#101828}.subtitle{font:14px Inter,system-ui,sans-serif;fill:#475467}.label{font:700 14px Inter,system-ui,sans-serif;fill:#344054}.tick{font:12px Inter,system-ui,sans-serif;fill:#667085}.note{font:13px Inter,system-ui,sans-serif;fill:#667085}.metric{font:700 18px Inter,system-ui,sans-serif;fill:#101828}
</style>
