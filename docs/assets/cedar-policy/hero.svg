<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Nested privilege ceilings: a business unit policy contains a team policy, which contains an agent policy, which contains a sub-agent policy. Each inner ceiling is a subset of the one around it, written grants(A) is a subset of grants(B).">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eaf5dc"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<rect width="1200" height="630" fill="none" stroke="#e6ebde" stroke-width="2"/>
<rect x="60" y="60" width="1080" height="510" rx="22" fill="#f1f7e6" stroke="#76b900" stroke-width="2"/>
<text x="84" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1b1c1e">Business unit</text>
<rect x="140" y="130" width="920" height="370" rx="22" fill="#e3f0cc" stroke="#76b900" stroke-width="2"/>
<text x="164" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1b1c1e">Team</text>
<rect x="220" y="200" width="760" height="230" rx="22" fill="#d2e8aa" stroke="#76b900" stroke-width="2"/>
<text x="244" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1b1c1e">Agent</text>
<rect x="300" y="270" width="600" height="90" rx="22" fill="#bfdd82" stroke="#76b900" stroke-width="2"/>
<text x="324" y="324" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1b1c1e">Sub-agent</text>
<text x="600" y="400" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="30" fill="#4f7d00">grants(A) ⊆ grants(B)</text>
<text x="1116" y="104" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="3" fill="#4f7d00">CEDAR POLICY CEILINGS</text>
</svg>
