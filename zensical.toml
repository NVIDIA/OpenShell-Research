[project]
site_name = "OpenShell Research"
site_url = "https://nvidia.github.io/OpenShell-Research/"
site_description = "Research engineering Dev Notes and documentation for secure AI agents, policy enforcement, automation, and robotics with OpenShell."
site_author = "OpenShell Research Engineering"
repo_url = "https://github.com/NVIDIA/OpenShell-Research"
repo_name = "OpenShell Research on GitHub"
copyright = """
<a href="https://github.com/NVIDIA/OpenShell">OpenShell on GitHub <span aria-hidden="true">↗</span></a>
"""
docs_dir = "docs"
site_dir = "site"
extra_css = [
  "stylesheets/dev-notes.css",
  "stylesheets/documentation.css"
]
extra_javascript = ["javascripts/navigation-drawer.js"]
nav = [
  {"Dev Notes" = [
    "dev-notes/index.md",
    {"Posts" = [
      # dev-notes:nav:start
      {"What we have learned applying formal methods to control AI agents" = "dev-notes/posts/2026-09-10-learning-formal-methods-agent-policy-prover.md"},
      {"Adversarial prototype: AI policy auto-approval for long-horizon agents in OpenShell" = "dev-notes/posts/2026-08-27-adversarial-policy-review-long-horizon-agents.md"},
      {"Can Formal Methods Govern AI-Generated Robot Actions?" = "dev-notes/posts/2026-08-07-formal-methods-ai-generated-robot-actions.md"},
      {"Bringing Privacy and Security to the Edge with OpenShell" = "dev-notes/posts/2026-07-20-policy-controlling-reachy-mini-with-openshell.md"}
      # dev-notes:nav:end
    ]}
  ]},
  {"Documentation" = [
    "documentation/index.md",
    {"OpenShell Agent Runner" = [
      "documentation/openshell-agent-runner/index.md",
      {"Run reviews" = "documentation/openshell-agent-runner/reviews.md"},
      {"Customize profiles" = "documentation/openshell-agent-runner/profiles.md"},
      {"Command reference" = "documentation/openshell-agent-runner/reference.md"}
    ]}
  ]}
]

[project.extra]
homepage = "."
generator = false

[project.extra.seo]
# Keep internal instructions and legacy entry points available without indexing them.
noindex_prefixes = ["development/", "projects/", "research/"]

[project.markdown_extensions.admonition]

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions."pymdownx.inlinehilite"]

[project.markdown_extensions."pymdownx.superfences"]

[project.theme]
custom_dir = "overrides"
favicon = "assets/brand/favicon.svg"
logo = "assets/brand/openshell-mark.svg"
icon.repo = "fontawesome/brands/github"
features = [
  "content.code.copy",
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",
  "navigation.footer",
  "navigation.top",
  "search.highlight",
  "toc.follow"
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "green"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "green"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"
