schema_version = 1
profile = "dev-notes"
threshold = 80
paths = ["docs/dev-notes/posts/*.md"]

[contexts]
scan_blockquotes = false
scan_headings = true
scan_captions = true

[categories.artifact]
cap = 100

[categories.rhetoric]
cap = 25

[categories.rhetoric.density]
unit = "paragraph"
window = 3
allowed_units = 3
first_cost = 2
repeat_cost = 1
cap = 5

[categories.vocabulary]
cap = 15

[categories.vocabulary.density]
unit = "paragraph"
window = 3
allowed_units = 3
first_cost = 1
repeat_cost = 1
cap = 4

[categories.repetition]
cap = 25

[categories.repetition.density]
unit = "paragraph"
window = 3
allowed_units = 4
first_cost = 2
repeat_cost = 1
cap = 5

[categories.attribution]
cap = 15

[categories.ending]
cap = 15

[categories.structure]
cap = 0

