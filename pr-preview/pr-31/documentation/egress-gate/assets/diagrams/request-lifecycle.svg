<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title description">
  <title id="title">Egress Gate request lifecycle</title>
  <desc id="description">The request lifecycle has four phases: validate the OpenShell request, validate and prepare the policy, run the configured gates, and serialize the result. Validation or execution failures end the RPC. Policy decisions and runtime-limit denials return normal middleware results.</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1f2933}
      .phase{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
      .transport{fill:#eef6ff;stroke:#3973ad;stroke-width:2}
      .config{fill:#fff5eb;stroke:#c86622;stroke-width:2}
      .process{fill:#f7f1ff;stroke:#8056a8;stroke-width:2}
      .result{fill:#eef9f1;stroke:#2f855a;stroke-width:2.5}
      .failure{fill:#fff1f2;stroke:#c84b5f;stroke-width:2}
      .phase-label{font-size:14px;font-weight:700;fill:#5f6b76;letter-spacing:.07em}
      .title{font-size:18px;font-weight:700}
      .step{font-size:14px;fill:#5f6b76}
      .arrow{fill:none;stroke:#718096;stroke-width:2.5;marker-end:url(#arrow)}
      .arrow-head{fill:#718096}
      .branch{fill:none;stroke:#a0aec0;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .branch-label{font-size:14px;font-weight:600;fill:#5f6b76}
      @media(prefers-color-scheme:dark){
        text{fill:#edf2f7}
        .phase{fill:#141b1f;stroke:#3d4852}
        .transport{fill:#162b3f;stroke:#7db6e8}
        .config{fill:#3a2819;stroke:#f6ad55}
        .process{fill:#2d203a;stroke:#b794d4}
        .result{fill:#143126;stroke:#68d391}
        .failure{fill:#3b2026;stroke:#f17b8c}
        .phase-label,.step,.branch-label{fill:#aeb8c5}
        .arrow{stroke:#8b98a5}
        .arrow-head{fill:#8b98a5}
        .branch{stroke:#71808e}
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" class="arrow-head"/>
    </marker>
  </defs>

  <rect x="34" y="34" width="235" height="368" rx="18" class="phase"/>
  <text x="56" y="65" class="phase-label">1 · TRANSPORT</text>
  <rect x="56" y="88" width="191" height="86" rx="13" class="transport"/>
  <text x="152" y="116" text-anchor="middle" class="title">Receive request</text>
  <text x="152" y="140" text-anchor="middle" class="step">OpenShell evaluation RPC</text>
  <text x="152" y="161" text-anchor="middle" class="step">pre-credentials phase</text>
  <path d="M152 174v38" class="arrow"/>
  <rect x="56" y="214" width="191" height="116" rx="13" class="transport"/>
  <text x="152" y="242" text-anchor="middle" class="title">Validate input</text>
  <text x="152" y="267" text-anchor="middle" class="step">phase · request context</text>
  <text x="152" y="289" text-anchor="middle" class="step">target · headers · body</text>
  <text x="152" y="311" text-anchor="middle" class="step">size · encoding bounds</text>

  <path d="M269 272h42" class="arrow"/>

  <rect x="313" y="34" width="235" height="368" rx="18" class="phase"/>
  <text x="335" y="65" class="phase-label">2 · CONFIGURATION</text>
  <rect x="335" y="88" width="191" height="96" rx="13" class="config"/>
  <text x="431" y="116" text-anchor="middle" class="title">Validate policy</text>
  <text x="431" y="141" text-anchor="middle" class="step">strict policy schema</text>
  <text x="431" y="163" text-anchor="middle" class="step">gates · default decision</text>
  <path d="M431 184v38" class="arrow"/>
  <rect x="335" y="224" width="191" height="116" rx="13" class="config"/>
  <text x="431" y="252" text-anchor="middle" class="title">Prepare pipeline</text>
  <text x="431" y="277" text-anchor="middle" class="step">reuse unchanged policy</text>
  <text x="431" y="299" text-anchor="middle" class="step">prepare changed policy</text>
  <text x="431" y="321" text-anchor="middle" class="step">activate when complete</text>

  <path d="M548 272h42" class="arrow"/>

  <rect x="592" y="34" width="235" height="368" rx="18" class="phase"/>
  <text x="614" y="65" class="phase-label">3 · PROCESSING</text>
  <rect x="614" y="88" width="191" height="86" rx="13" class="process"/>
  <text x="710" y="116" text-anchor="middle" class="title">Build request</text>
  <text x="710" y="141" text-anchor="middle" class="step">immutable HTTP model</text>
  <text x="710" y="162" text-anchor="middle" class="step">body remains bytes</text>
  <path d="M710 174v38" class="arrow"/>
  <rect x="614" y="214" width="191" height="116" rx="13" class="process"/>
  <text x="710" y="242" text-anchor="middle" class="title">Run gates</text>
  <text x="710" y="267" text-anchor="middle" class="step">evaluate in policy order</text>
  <text x="710" y="289" text-anchor="middle" class="step">share one deadline</text>
  <text x="710" y="311" text-anchor="middle" class="step">apply validated patches</text>

  <path d="M827 272h42" class="arrow"/>

  <rect x="871" y="34" width="195" height="368" rx="18" class="phase"/>
  <text x="893" y="65" class="phase-label">4 · RESULT</text>
  <rect x="883" y="88" width="171" height="116" rx="13" class="result"/>
  <text x="969" y="116" text-anchor="middle" class="title">Build result</text>
  <text x="969" y="142" text-anchor="middle" class="step">allow or deny</text>
  <text x="969" y="164" text-anchor="middle" class="step">optional patch</text>
  <text x="969" y="186" text-anchor="middle" class="step">bounded findings</text>
  <path d="M969 204v38" class="arrow"/>
  <rect x="883" y="244" width="171" height="86" rx="13" class="result"/>
  <text x="969" y="272" text-anchor="middle" class="title">Serialize</text>
  <text x="969" y="297" text-anchor="middle" class="step">OpenShell wire result</text>
  <text x="969" y="318" text-anchor="middle" class="step">five-field findings</text>

  <rect x="34" y="446" width="514" height="132" rx="18" class="failure"/>
  <text x="58" y="479" class="phase-label">RPC FAILURE</text>
  <text x="58" y="511" class="title">Return a gRPC error</text>
  <text x="58" y="538" class="step">INVALID_ARGUMENT · invalid input</text>
  <text x="58" y="560" class="step">INTERNAL · gate or service failure</text>
  <path d="M152 330v114" class="branch"/>
  <path d="M431 340v104" class="branch"/>
  <path d="M710 330v54c0 12-10 22-22 22H540c-12 0-20 8-20 20v18" class="branch"/>

  <rect x="592" y="446" width="474" height="132" rx="18" class="result"/>
  <text x="616" y="479" class="phase-label">SUCCESSFUL MIDDLEWARE RESULT</text>
  <text x="616" y="511" class="title">Return allow or deny</text>
  <text x="616" y="538" class="step">Optional validated patch and findings</text>
  <text x="616" y="560" class="step">Stable reason code for every denial</text>
  <path d="M969 330v114" class="branch"/>
</svg>
