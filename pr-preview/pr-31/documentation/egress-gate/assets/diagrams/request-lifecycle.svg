<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title description">
  <title id="title">Egress Gate request lifecycle</title>
  <desc id="description">The request lifecycle has four phases: validate the OpenShell transport, validate and activate configuration, adapt and process the current request, and serialize the result. Invalid input fails the RPC, while policy and limit decisions return successful allow or deny results.</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1f2933}
      .phase{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
      .transport{fill:#eef6ff;stroke:#3973ad;stroke-width:2}
      .config{fill:#fff5eb;stroke:#c86622;stroke-width:2}
      .process{fill:#f7f1ff;stroke:#8056a8;stroke-width:2}
      .result{fill:#eef9f1;stroke:#2f855a;stroke-width:2.5}
      .failure{fill:#fff1f2;stroke:#c84b5f;stroke-width:2}
      .phase-label{font-size:14px;font-weight:700;fill:#5f6b76;letter-spacing:.07em}
      .title{font-size:19px;font-weight:700}
      .step{font-size:15px;fill:#5f6b76}
      .arrow{fill:none;stroke:#718096;stroke-width:2.5;marker-end:url(#arrow)}
      .arrow-head{fill:#718096}
      .branch{fill:none;stroke:#a0aec0;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .branch-label{font-size:14px;font-weight:600;fill:#5f6b76}
      @media(prefers-color-scheme:dark){
        text{fill:#edf2f7}
        .phase{fill:#141b1f;stroke:#3d4852}
        .transport{fill:#162b3f;stroke:#7db6e8}
        .config{fill:#3a2819;stroke:#f6ad55}
        .process{fill:#2d203a;stroke:#b794d4}
        .result{fill:#143126;stroke:#68d391}
        .failure{fill:#3b2026;stroke:#f17b8c}
        .phase-label,.step,.branch-label{fill:#aeb8c5}
        .arrow{stroke:#8b98a5}
        .arrow-head{fill:#8b98a5}
        .branch{stroke:#71808e}
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" class="arrow-head"/>
    </marker>
  </defs>

  <rect x="34" y="34" width="210" height="368" rx="18" class="phase"/>
  <text x="56" y="65" class="phase-label">1 · TRANSPORT</text>
  <rect x="56" y="88" width="166" height="86" rx="13" class="transport"/>
  <text x="139" y="116" text-anchor="middle" class="title">Receive</text>
  <text x="139" y="140" text-anchor="middle" class="step">HttpRequestEvaluation</text>
  <text x="139" y="161" text-anchor="middle" class="step">pre-credentials phase</text>
  <path d="M139 174v38" class="arrow"/>
  <rect x="56" y="214" width="166" height="116" rx="13" class="transport"/>
  <text x="139" y="242" text-anchor="middle" class="title">Validate bounds</text>
  <text x="139" y="267" text-anchor="middle" class="step">context · config</text>
  <text x="139" y="289" text-anchor="middle" class="step">target · headers · body</text>
  <text x="139" y="311" text-anchor="middle" class="step">phase</text>

  <path d="M244 272h42" class="arrow"/>

  <rect x="288" y="34" width="210" height="368" rx="18" class="phase"/>
  <text x="310" y="65" class="phase-label">2 · CONFIGURATION</text>
  <rect x="310" y="88" width="166" height="96" rx="13" class="config"/>
  <text x="393" y="116" text-anchor="middle" class="title">Validate policy</text>
  <text x="393" y="141" text-anchor="middle" class="step">typed union · gates</text>
  <text x="393" y="163" text-anchor="middle" class="step">resources · default</text>
  <path d="M393 184v38" class="arrow"/>
  <rect x="310" y="224" width="166" height="106" rx="13" class="config"/>
  <text x="393" y="252" text-anchor="middle" class="title">Resolve processor</text>
  <text x="393" y="277" text-anchor="middle" class="step">reuse equal config</text>
  <text x="393" y="299" text-anchor="middle" class="step">or prepare + activate</text>

  <path d="M498 272h42" class="arrow"/>

  <rect x="542" y="34" width="210" height="368" rx="18" class="phase"/>
  <text x="564" y="65" class="phase-label">3 · PROCESSING</text>
  <rect x="564" y="88" width="166" height="86" rx="13" class="process"/>
  <text x="647" y="116" text-anchor="middle" class="title">Build request</text>
  <text x="647" y="141" text-anchor="middle" class="step">transport-free model</text>
  <text x="647" y="162" text-anchor="middle" class="step">target · headers · bytes</text>
  <path d="M647 174v38" class="arrow"/>
  <rect x="564" y="214" width="166" height="116" rx="13" class="process"/>
  <text x="647" y="242" text-anchor="middle" class="title">Run pipeline</text>
  <text x="647" y="267" text-anchor="middle" class="step">ordered gates</text>
  <text x="647" y="289" text-anchor="middle" class="step">one shared timeout</text>
  <text x="647" y="311" text-anchor="middle" class="step">aggregate findings</text>

  <path d="M752 272h20" class="arrow"/>

  <rect x="774" y="34" width="172" height="368" rx="18" class="phase"/>
  <text x="796" y="65" class="phase-label">4 · RESULT</text>
  <rect x="796" y="88" width="128" height="116" rx="13" class="result"/>
  <text x="860" y="116" text-anchor="middle" class="title">Finalize</text>
  <text x="860" y="142" text-anchor="middle" class="step">decision</text>
  <text x="860" y="164" text-anchor="middle" class="step">request patch</text>
  <text x="860" y="186" text-anchor="middle" class="step">findings</text>
  <path d="M860 204v38" class="arrow"/>
  <rect x="796" y="244" width="128" height="86" rx="13" class="result"/>
  <text x="860" y="272" text-anchor="middle" class="title">Serialize</text>
  <text x="860" y="297" text-anchor="middle" class="step">allow or deny</text>
  <text x="860" y="318" text-anchor="middle" class="step">patch + findings</text>

  <rect x="34" y="446" width="442" height="132" rx="18" class="failure"/>
  <text x="58" y="479" class="phase-label">RPC FAILURE</text>
  <text x="58" y="511" class="title">Invalid input or internal failure</text>
  <text x="58" y="538" class="step">INVALID_ARGUMENT or INTERNAL</text>
  <text x="58" y="560" class="step">OpenShell applies middleware on_error</text>
  <path d="M139 330v114" class="branch"/>
  <path d="M393 330v114" class="branch"/>

  <rect x="542" y="446" width="404" height="132" rx="18" class="result"/>
  <text x="566" y="479" class="phase-label">SUCCESSFUL MIDDLEWARE RESULT</text>
  <text x="566" y="511" class="title">Return an allow or deny decision</text>
  <text x="566" y="538" class="step">Validated request patch and findings</text>
  <text x="566" y="560" class="step">Stable reason code for each denial</text>
  <path d="M860 330v114" class="branch"/>
</svg>
