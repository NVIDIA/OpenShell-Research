<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720" role="img" aria-labelledby="title description">
  <title id="title">Egress Gate request path</title>
  <desc id="description">The OpenShell supervisor sends an intercepted request and policy to Egress Gate. Egress Gate runs gates that inspect the request and propose mutations, then returns an allow with final mutations or a deny. The supervisor applies allowed mutations, attaches credentials, and sends the request to the provider.</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1f2933}
      .card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
      .egress{fill:#eef9f1;stroke:#2f855a;stroke-width:2.5}
      .provider{fill:#eef6ff;stroke:#3973ad;stroke-width:2}
      .icon-bg{fill:#e8edf2}
      .egress-icon-bg{fill:#d8f3e2}
      .provider-icon-bg{fill:#dcecff}
      .icon-stroke{fill:none;stroke:#5f6b76}
      .egress-icon-stroke{fill:none;stroke:#2f855a}
      .provider-icon-stroke{fill:none;stroke:#3973ad}
      .title{font-size:24px;font-weight:700}
      .subtitle{font-size:17px;fill:#5f6b76}
      .badge{fill:#2f855a}
      .badge-text{font-size:13px;font-weight:700;fill:#fff;letter-spacing:.035em}
      .arrow{fill:none;stroke:#718096;stroke-width:2.5;marker-end:url(#arrow)}
      .arrow-head{fill:#718096}
      .arrow-label{font-size:16px;fill:#5f6b76}
      @media(prefers-color-scheme:dark){
        text{fill:#edf2f7}
        .card{fill:#182126;stroke:#52606d}
        .egress{fill:#143126;stroke:#68d391}
        .provider{fill:#162b3f;stroke:#7db6e8}
        .icon-bg{fill:#273238}
        .egress-icon-bg{fill:#204534}
        .provider-icon-bg{fill:#203b52}
        .icon-stroke{stroke:#aeb8c5}
        .egress-icon-stroke{stroke:#68d391}
        .provider-icon-stroke{stroke:#7db6e8}
        .subtitle,.arrow-label{fill:#aeb8c5}
        .badge{fill:#3f9d6b}
        .arrow{stroke:#8b98a5}
        .arrow-head{fill:#8b98a5}
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" class="arrow-head"/>
    </marker>
  </defs>

  <rect x="100" y="28" width="560" height="92" rx="16" class="card"/>
  <circle cx="148" cy="74" r="25" class="icon-bg"/>
  <path d="M137 75h22M148 64v22" class="icon-stroke" stroke-width="3" stroke-linecap="round"/>
  <text x="188" y="66" class="title">Sandbox application</text>
  <text x="188" y="92" class="subtitle">Creates a provider-bound HTTP request</text>

  <path d="M380 120v58" class="arrow"/>
  <text x="400" y="154" class="arrow-label">request</text>

  <rect x="100" y="180" width="560" height="92" rx="16" class="card"/>
  <circle cx="148" cy="226" r="25" class="icon-bg"/>
  <path d="M137 216h22v20h-22zM142 211h12" class="icon-stroke" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="188" y="218" class="title">OpenShell supervisor</text>
  <text x="188" y="244" class="subtitle">Routes the request before credentials are attached</text>

  <path d="M380 272v58" class="arrow"/>
  <text x="400" y="306" class="arrow-label">request + policy over gRPC</text>

  <rect x="100" y="332" width="560" height="112" rx="16" class="egress"/>
  <rect x="484" y="350" width="152" height="25" rx="12.5" class="badge"/>
  <text x="560" y="368" text-anchor="middle" class="badge-text">PRE-CREDENTIALS</text>
  <circle cx="148" cy="388" r="25" class="egress-icon-bg"/>
  <path d="M148 370 164 378v12c0 13-8 21-16 25-8-4-16-12-16-25v-12z" class="egress-icon-stroke" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="m141 389 5 5 10-12" class="egress-icon-stroke" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="188" y="380" class="title">Egress Gate</text>
  <text x="188" y="410" class="subtitle">Runs gates that inspect requests and propose mutations</text>

  <path d="M380 444v58" class="arrow"/>
  <text x="400" y="478" class="arrow-label">allow + final mutations, or deny</text>

  <rect x="100" y="504" width="560" height="92" rx="16" class="card"/>
  <circle cx="148" cy="550" r="25" class="icon-bg"/>
  <path d="M137 540h22v20h-22zM142 535h12" class="icon-stroke" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="188" y="542" class="title">OpenShell supervisor</text>
  <text x="188" y="568" class="subtitle">Applies mutations · attaches credentials after allow</text>

  <path d="M380 596v58" class="arrow"/>
  <text x="400" y="630" class="arrow-label">authorized request</text>

  <rect x="100" y="656" width="560" height="54" rx="16" class="provider"/>
  <circle cx="148" cy="683" r="17" class="provider-icon-bg"/>
  <path d="M137 683h22M148 672a17 17 0 0 0 0 22M148 672a17 17 0 0 1 0 22" class="provider-icon-stroke" stroke-width="2"/>
  <text x="188" y="691" class="title">Provider</text>
</svg>
