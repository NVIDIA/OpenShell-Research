<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Ten GPT-5.6 Terra planning loops with policy-prover overhead</title>
  <desc id="desc">Ten successful runs show initial planning and replanning inference totaling 7.5 to 16.9 seconds. The two policy checks total 5.76 to 26.23 milliseconds, or 0.05 to 0.26 percent of inference time.</desc>
  <style>
    .bg { fill: #f7f8fa; }
    .panel { fill: #fff; stroke: #d0d5dd; stroke-width: 1.5; }
    .title { font: 700 25px Inter, system-ui, sans-serif; fill: #101828; }
    .subtitle { font: 15px Inter, system-ui, sans-serif; fill: #475467; }
    .heading { font: 700 17px Inter, system-ui, sans-serif; fill: #101828; }
    .label { font: 13px Inter, system-ui, sans-serif; fill: #475467; }
    .value { font: 700 12px Inter, system-ui, sans-serif; fill: #344054; }
    .grid { stroke: #e4e7ec; stroke-width: 1; }
    .median { stroke: #667085; stroke-width: 2; stroke-dasharray: 6 5; }
    .initial { fill: #2f6f9f; }
    .replan { fill: #73a7cc; }
    .policy { fill: #76b900; }
  </style>

  <rect class="bg" width="1200" height="780" rx="18"/>
  <text class="title" x="54" y="48">Ten Terra planning loops: variable inference, small policy overhead</text>
  <text class="subtitle" x="54" y="76">All 10 runs completed deny → replan → constrain → execute with no fixture fallback.</text>

  <rect class="panel" x="48" y="103" width="1104" height="354" rx="15"/>
  <text class="heading" x="76" y="135">Model inference per mission</text>
  <text class="label" x="1120" y="135" text-anchor="end">seconds · initial plan + replan</text>

  <line class="grid" x1="160" y1="154" x2="160" y2="425"/>
  <line class="grid" x1="317.5" y1="154" x2="317.5" y2="425"/>
  <line class="grid" x1="475" y1="154" x2="475" y2="425"/>
  <line class="grid" x1="632.5" y1="154" x2="632.5" y2="425"/>
  <line class="grid" x1="790" y1="154" x2="790" y2="425"/>
  <line class="grid" x1="947.5" y1="154" x2="947.5" y2="425"/>
  <line class="grid" x1="1105" y1="154" x2="1105" y2="425"/>
  <line class="median" x1="698.8" y1="154" x2="698.8" y2="425"/>

  <text class="label" x="160" y="445" text-anchor="middle">0</text>
  <text class="label" x="317.5" y="445" text-anchor="middle">3</text>
  <text class="label" x="475" y="445" text-anchor="middle">6</text>
  <text class="label" x="632.5" y="445" text-anchor="middle">9</text>
  <text class="label" x="790" y="445" text-anchor="middle">12</text>
  <text class="label" x="947.5" y="445" text-anchor="middle">15</text>
  <text class="label" x="1105" y="445" text-anchor="middle">18 s</text>
  <text class="label" x="706" y="171">median total 10.26 s</text>

  <g>
    <text class="label" x="82" y="190">Run 1</text><rect class="initial" x="160" y="176" width="544.8" height="17" rx="3"/><rect class="replan" x="704.8" y="176" width="342.5" height="17" rx="3"/><text class="value" x="1057" y="190">16.90</text>
    <text class="label" x="82" y="216">Run 2</text><rect class="initial" x="160" y="202" width="132.3" height="17" rx="3"/><rect class="replan" x="292.3" y="202" width="344.2" height="17" rx="3"/><text class="value" x="646" y="216">9.08</text>
    <text class="label" x="82" y="242">Run 3</text><rect class="initial" x="160" y="228" width="121.7" height="17" rx="3"/><rect class="replan" x="281.7" y="228" width="558.6" height="17" rx="3"/><text class="value" x="850" y="242">12.96</text>
    <text class="label" x="82" y="268">Run 4</text><rect class="initial" x="160" y="254" width="134.6" height="17" rx="3"/><rect class="replan" x="294.6" y="254" width="261.0" height="17" rx="3"/><text class="value" x="565" y="268">7.53</text>
    <text class="label" x="82" y="294">Run 5</text><rect class="initial" x="160" y="280" width="121.9" height="17" rx="3"/><rect class="replan" x="281.9" y="280" width="517.6" height="17" rx="3"/><text class="value" x="809" y="294">12.18</text>
    <text class="label" x="82" y="320">Run 6</text><rect class="initial" x="160" y="306" width="161.2" height="17" rx="3"/><rect class="replan" x="321.2" y="306" width="481.2" height="17" rx="3"/><text class="value" x="812" y="320">12.24</text>
    <text class="label" x="82" y="346">Run 7</text><rect class="initial" x="160" y="332" width="151.0" height="17" rx="3"/><rect class="replan" x="311.0" y="332" width="339.7" height="17" rx="3"/><text class="value" x="660" y="346">9.35</text>
    <text class="label" x="82" y="372">Run 8</text><rect class="initial" x="160" y="358" width="127.8" height="17" rx="3"/><rect class="replan" x="287.8" y="358" width="446.6" height="17" rx="3"/><text class="value" x="744" y="372">10.94</text>
    <text class="label" x="82" y="398">Run 9</text><rect class="initial" x="160" y="384" width="187.8" height="17" rx="3"/><rect class="replan" x="347.8" y="384" width="315.3" height="17" rx="3"/><text class="value" x="673" y="398">9.58</text>
    <text class="label" x="76" y="424">Run 10</text><rect class="initial" x="160" y="410" width="119.9" height="17" rx="3"/><rect class="replan" x="279.9" y="410" width="348.2" height="17" rx="3"/><text class="value" x="638" y="424">8.92</text>
  </g>

  <rect class="initial" x="76" y="467" width="16" height="10" rx="2"/><text class="label" x="100" y="477">initial plan</text>
  <rect class="replan" x="205" y="467" width="16" height="10" rx="2"/><text class="label" x="229" y="477">replan after prover feedback</text>

  <rect class="panel" x="48" y="495" width="1104" height="239" rx="15"/>
  <text class="heading" x="76" y="527">Two policy checks as a share of model inference</text>
  <text class="label" x="1120" y="527" text-anchor="end">percent · lower is less planning-loop overhead</text>

  <line class="grid" x1="160" y1="548" x2="160" y2="708"/>
  <line class="grid" x1="475" y1="548" x2="475" y2="708"/>
  <line class="grid" x1="790" y1="548" x2="790" y2="708"/>
  <line class="grid" x1="1105" y1="548" x2="1105" y2="708"/>
  <line class="median" x1="635.5" y1="548" x2="635.5" y2="708"/>
  <text class="label" x="642" y="562">median 0.16%</text>

  <g>
    <text class="label" x="82" y="579">Run 1</text><rect class="policy" x="160" y="568" width="264.5" height="12" rx="3"/><text class="value" x="433" y="579">0.09%</text>
    <text class="label" x="82" y="595">Run 2</text><rect class="policy" x="160" y="584" width="705.7" height="12" rx="3"/><text class="value" x="874" y="595">0.24%</text>
    <text class="label" x="82" y="611">Run 3</text><rect class="policy" x="160" y="600" width="607.3" height="12" rx="3"/><text class="value" x="776" y="611">0.20%</text>
    <text class="label" x="82" y="627">Run 4</text><rect class="policy" x="160" y="616" width="792.0" height="12" rx="3"/><text class="value" x="961" y="627">0.26%</text>
    <text class="label" x="82" y="643">Run 5</text><rect class="policy" x="160" y="632" width="141.9" height="12" rx="3"/><text class="value" x="310" y="643">0.05%</text>
    <text class="label" x="82" y="659">Run 6</text><rect class="policy" x="160" y="648" width="158.4" height="12" rx="3"/><text class="value" x="327" y="659">0.05%</text>
    <text class="label" x="82" y="675">Run 7</text><rect class="policy" x="160" y="664" width="751.8" height="12" rx="3"/><text class="value" x="920" y="675">0.25%</text>
    <text class="label" x="82" y="691">Run 8</text><rect class="policy" x="160" y="680" width="165.4" height="12" rx="3"/><text class="value" x="334" y="691">0.06%</text>
    <text class="label" x="82" y="707">Run 9</text><rect class="policy" x="160" y="696" width="616.3" height="12" rx="3"/><text class="value" x="785" y="707">0.21%</text>
    <text class="label" x="76" y="723">Run 10</text><rect class="policy" x="160" y="712" width="343.6" height="12" rx="3"/><text class="value" x="512" y="723">0.11%</text>
  </g>

  <text class="label" x="160" y="754" text-anchor="middle">0%</text>
  <text class="label" x="475" y="754" text-anchor="middle">0.10%</text>
  <text class="label" x="790" y="754" text-anchor="middle">0.20%</text>
  <text class="label" x="1105" y="754" text-anchor="middle">0.30%</text>
</svg>
