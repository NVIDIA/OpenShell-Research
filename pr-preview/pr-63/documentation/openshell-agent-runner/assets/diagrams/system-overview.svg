<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 760" role="img" aria-labelledby="title description">
  <title id="title">Independent OAR runs on one OpenShell gateway</title>
  <desc id="description">Three separate oar run invocations share one OpenShell gateway. Runs 1 and 3 use the code-reviewer profile on different projects. Run 2 uses technical-writing-reviewer on a document. Each profile supplies the selected task's prompt and skills. Each run uploads its own input to a separate sandbox, runs Pi with those instructions, and returns its own result file. OAR removes each sandbox when its task finishes; the gateway remains available.</desc>
  <defs>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#24352c}
      .host{fill:#f4f5f2;stroke:#c8cec8;stroke-width:1.5}
      .gateway{fill:#f5f9ee;stroke:#7da54b;stroke-width:2}
      .sandbox{fill:#fff;stroke:#9dad9e;stroke-width:1.5;stroke-dasharray:5 4}
      .writing{stroke:#7598ae}
      .profile-bundle{fill:#f1f6e9;stroke:#c0d0ac;stroke-width:1}
      .profile-writing{fill:#eef4f8;stroke:#b8cbd7}
      .resource{fill:#fff;stroke:#b1bfaa;stroke-width:1}
      .resource-label{font-size:14px;font-weight:600}
      .heading{font-size:25px;font-weight:650}
      .label{font-size:17px;font-weight:600}
      .note{font-size:16px;fill:#53665a}
      .small{font-size:14px;fill:#53665a}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
      .profile{font-size:20px;font-weight:600}
      .input{font-size:18px}
      .result{font-size:15px;fill:#53665a}
      .rule{stroke:#c8cec8;stroke-width:1}
      .launch{fill:none;stroke:#568029;stroke-width:2;marker-end:url(#launch-arrow)}
      .return{fill:none;stroke:#73877b;stroke-width:1.7;stroke-dasharray:4 4;marker-end:url(#return-arrow)}
      .code-badge{fill:#e6efda;stroke:#a2b887;stroke-width:1}
      .writing-badge{fill:#e8f0f5;stroke:#94adbd;stroke-width:1}
      .number{font-size:14px;font-weight:650;text-anchor:middle}
      @media(prefers-color-scheme:dark){
        text{fill:#edf3ee}
        .host{fill:#202722;stroke:#59685e}
        .gateway{fill:#23301b;stroke:#8eaf62}
        .sandbox{fill:#1c2720;stroke:#859788}
        .writing{stroke:#85a6bb}
        .profile-bundle{fill:#2b3b23;stroke:#657c52}
        .profile-writing{fill:#273b47;stroke:#607f91}
        .resource{fill:#202c25;stroke:#788d70}
        .note,.small,.result{fill:#bdcbbf}
        .rule{stroke:#59685e}
        .code-badge{fill:#354b26;stroke:#7b9c57}
        .writing-badge{fill:#293f4c;stroke:#799cac}
        .launch{stroke:#8eb55d}
      }
    </style>
    <marker id="launch-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#719447"/>
    </marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#73877b"/>
    </marker>
  </defs>

  <!-- The caller owns the invocations, original inputs, and returned results. -->
  <rect x="20" y="22" width="232" height="714" rx="16" class="host"/>
  <text x="40" y="57" class="label">Your terminal or CI</text>
  <path d="m42 78 8 7-8 7m15 0h10" fill="none" stroke="#73877b" stroke-width="2"/>
  <text x="78" y="97" class="heading">OAR</text>
  <text x="40" y="125" class="note">One invocation per task</text>

  <!-- A single gateway contains all three isolated sandboxes. -->
  <rect x="330" y="22" width="490" height="714" rx="16" class="gateway"/>
  <text x="354" y="61" class="heading">OpenShell gateway</text>
  <text x="354" y="93" class="note">Reused across runs</text>
  <text x="354" y="120" class="note">Shared inference connection</text>

  <!-- Run 1: the selected profile supplies the task's prompt and skills. -->
  <path d="M40 149H232" class="rule"/>
  <circle cx="49" cy="179" r="12" class="code-badge"/>
  <text x="49" y="184" class="number">1</text>
  <text x="74" y="185" class="mono label">oar run</text>
  <text x="40" y="218" class="mono input">./service/</text>
  <text x="40" y="294" class="mono result">service-review.json</text>

  <rect x="356" y="155" width="438" height="155" rx="10" class="sandbox"/>
  <text x="376" y="180" class="label">Sandbox 1</text>
  <text x="774" y="180" text-anchor="end" class="small">Pi + uploaded files</text>
  <g role="group" aria-label="code-reviewer profile: task prompt and skills">
    <rect x="372" y="194" width="406" height="102" rx="7" class="profile-bundle"/>
    <text x="388" y="220" class="mono profile">code-reviewer</text>
    <text x="388" y="246" class="mono note">review-repository</text>
    <rect x="388" y="260" width="96" height="24" rx="5" class="resource"/>
    <text x="436" y="277" text-anchor="middle" class="resource-label">Prompts</text>
    <text x="499" y="277" text-anchor="middle" class="small">+</text>
    <rect x="514" y="260" width="80" height="24" rx="5" class="resource"/>
    <text x="554" y="277" text-anchor="middle" class="resource-label">Skills</text>
  </g>
  <path d="M252 213H354" class="launch"/>
  <text x="292" y="203" text-anchor="middle" class="small">input</text>
  <path d="M356 289H254" class="return"/>
  <text x="292" y="279" text-anchor="middle" class="small">result</text>

  <!-- Run 2: the selected profile supplies the task's prompt and skills. -->
  <path d="M40 331H232" class="rule"/>
  <circle cx="49" cy="361" r="12" class="writing-badge"/>
  <text x="49" y="366" class="number">2</text>
  <text x="74" y="367" class="mono label">oar run</text>
  <text x="40" y="400" class="mono input">./design.md</text>
  <text x="40" y="476" class="mono result">writing-review.json</text>

  <rect x="356" y="337" width="438" height="155" rx="10" class="sandbox writing"/>
  <text x="376" y="362" class="label">Sandbox 2</text>
  <text x="774" y="362" text-anchor="end" class="small">Pi + uploaded files</text>
  <g role="group" aria-label="technical-writing-reviewer profile: task prompt and skills">
    <rect x="372" y="376" width="406" height="102" rx="7" class="profile-bundle profile-writing"/>
    <text x="388" y="402" class="mono profile">technical-writing-reviewer</text>
    <text x="388" y="428" class="mono note">review-document</text>
    <rect x="388" y="442" width="96" height="24" rx="5" class="resource"/>
    <text x="436" y="459" text-anchor="middle" class="resource-label">Prompts</text>
    <text x="499" y="459" text-anchor="middle" class="small">+</text>
    <rect x="514" y="442" width="80" height="24" rx="5" class="resource"/>
    <text x="554" y="459" text-anchor="middle" class="resource-label">Skills</text>
  </g>
  <path d="M252 395H354" class="launch"/>
  <text x="292" y="385" text-anchor="middle" class="small">input</text>
  <path d="M356 471H254" class="return"/>
  <text x="292" y="461" text-anchor="middle" class="small">result</text>

  <!-- Run 3: the selected profile supplies the task's prompt and skills. -->
  <path d="M40 513H232" class="rule"/>
  <circle cx="49" cy="543" r="12" class="code-badge"/>
  <text x="49" y="548" class="number">3</text>
  <text x="74" y="549" class="mono label">oar run</text>
  <text x="40" y="582" class="mono input">./cli/</text>
  <text x="40" y="658" class="mono result">cli-review.json</text>

  <rect x="356" y="519" width="438" height="155" rx="10" class="sandbox"/>
  <text x="376" y="544" class="label">Sandbox 3</text>
  <text x="774" y="544" text-anchor="end" class="small">Pi + uploaded files</text>
  <g role="group" aria-label="code-reviewer profile: task prompt and skills">
    <rect x="372" y="558" width="406" height="102" rx="7" class="profile-bundle"/>
    <text x="388" y="584" class="mono profile">code-reviewer</text>
    <text x="388" y="610" class="mono note">review-repository</text>
    <rect x="388" y="624" width="96" height="24" rx="5" class="resource"/>
    <text x="436" y="641" text-anchor="middle" class="resource-label">Prompts</text>
    <text x="499" y="641" text-anchor="middle" class="small">+</text>
    <rect x="514" y="624" width="80" height="24" rx="5" class="resource"/>
    <text x="554" y="641" text-anchor="middle" class="resource-label">Skills</text>
  </g>
  <path d="M252 577H354" class="launch"/>
  <text x="292" y="567" text-anchor="middle" class="small">input</text>
  <path d="M356 653H254" class="return"/>
  <text x="292" y="643" text-anchor="middle" class="small">result</text>

  <text x="40" y="709" class="small">One output file per run.</text>
  <text x="354" y="701" class="note">Each sandbox is removed when its task finishes.</text>
  <text x="354" y="724" class="small">The gateway stays available for the next run.</text>
</svg>
