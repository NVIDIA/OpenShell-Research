<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title description">
  <title id="title">OAR result handling</title>
  <desc id="description">Tasks without an output schema capture Pi's final response. Tasks with a schema use submit_result and Ajv for in-session correction. Both results are downloaded, checked on the host, and atomically published.</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1f2933}
      .choice{fill:#fff5eb;stroke:#c86622;stroke-width:2}.plain{fill:#eef6ff;stroke:#3973ad;stroke-width:2}.structured{fill:#eef9f1;stroke:#2f855a;stroke-width:2}.host{fill:#f7f1ff;stroke:#8056a8;stroke-width:2}
      .title{font-size:19px;font-weight:700}.subtitle{font-size:14px;fill:#5f6b76}.label{font-size:14px;font-weight:700;fill:#5f6b76}
      .arrow{fill:none;stroke:#718096;stroke-width:2.5;marker-end:url(#arrow)}.retry{fill:none;stroke:#c86622;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrow)}
      @media(prefers-color-scheme:dark){text{fill:#edf2f7}.choice{fill:#3a2819;stroke:#f6ad55}.plain{fill:#162b3f;stroke:#7db6e8}.structured{fill:#143126;stroke:#68d391}.host{fill:#2d203a;stroke:#b794d4}.subtitle,.label{fill:#aeb8c5}.arrow{stroke:#8b98a5}.retry{stroke:#f6ad55}}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#718096"/></marker>
  </defs>

  <rect x="410" y="35" width="300" height="75" rx="15" class="choice"/>
  <text x="560" y="66" text-anchor="middle" class="title">Task completes</text><text x="560" y="91" text-anchor="middle" class="subtitle">Does it declare output_schema?</text>

  <text x="305" y="145" text-anchor="middle" class="label">No</text><text x="815" y="145" text-anchor="middle" class="label">Yes</text>
  <rect x="90" y="165" width="430" height="85" rx="15" class="plain"/>
  <text x="305" y="198" text-anchor="middle" class="title">Capture final Pi response</text><text x="305" y="224" text-anchor="middle" class="subtitle">stdout becomes the result artifact</text>

  <rect x="600" y="165" width="430" height="85" rx="15" class="structured"/>
  <text x="815" y="198" text-anchor="middle" class="title">Call submit_result</text><text x="815" y="224" text-anchor="middle" class="subtitle">{ result: ... }</text>
  <rect x="600" y="305" width="430" height="85" rx="15" class="structured"/>
  <text x="815" y="338" text-anchor="middle" class="title">Ajv validates in session</text><text x="815" y="364" text-anchor="middle" class="subtitle">Draft 2020-12 schema</text>

  <rect x="345" y="445" width="430" height="105" rx="15" class="host"/>
  <text x="560" y="480" text-anchor="middle" class="title">Host acceptance boundary</text>
  <text x="560" y="508" text-anchor="middle" class="subtitle">download · size check · optional schema validation</text>
  <text x="560" y="532" text-anchor="middle" class="subtitle">atomic publication</text>

  <path d="M480 110L340 165" class="arrow"/><path d="M640 110l140 55" class="arrow"/>
  <path d="M815 250v55" class="arrow"/>
  <path d="M600 347H555c-35 0-35-140 0-140h45" class="retry"/><text x="542" y="282" text-anchor="end" class="label">invalid: return errors</text>
  <path d="M305 250v145c0 28 20 50 48 50h35" class="arrow"/>
  <path d="M815 390v5c0 28-20 50-48 50h-35" class="arrow"/>
  <text x="832" y="420" class="label">valid</text>
</svg>
