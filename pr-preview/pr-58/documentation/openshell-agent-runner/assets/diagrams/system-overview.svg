<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title description">
  <title id="title">OpenShell Agent Runner system overview</title>
  <desc id="description">A user or CI job invokes OAR for one task. OAR launches an ephemeral Pi agent in an OpenShell sandbox, publishes one result, and removes the sandbox.</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1f2933}
      .group{fill:#f8fafc;stroke:#d7dee5;stroke-width:2}
      .host{fill:#eef6ff;stroke:#3973ad;stroke-width:2}
      .open{fill:#fff5eb;stroke:#c86622;stroke-width:2}
      .agent{fill:#eef9f1;stroke:#2f855a;stroke-width:2}
      .artifact{fill:#f7f1ff;stroke:#8056a8;stroke-width:2}
      .heading{font-size:15px;font-weight:700;fill:#5f6b76;letter-spacing:.08em}
      .title{font-size:21px;font-weight:700}
      .subtitle{font-size:15px;fill:#5f6b76}
      .arrow{fill:none;stroke:#718096;stroke-width:2.5;marker-end:url(#arrow)}
      .label{font-size:14px;fill:#5f6b76}
      @media(prefers-color-scheme:dark){
        text{fill:#edf2f7}.group{fill:#141b1f;stroke:#3d4852}.host{fill:#162b3f;stroke:#7db6e8}.open{fill:#3a2819;stroke:#f6ad55}.agent{fill:#143126;stroke:#68d391}.artifact{fill:#2d203a;stroke:#b794d4}.heading,.subtitle,.label{fill:#aeb8c5}.arrow{stroke:#8b98a5}
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#718096"/>
    </marker>
  </defs>

  <rect x="20" y="25" width="310" height="470" rx="20" class="group"/>
  <text x="45" y="57" class="heading">HOST</text>
  <rect x="50" y="85" width="250" height="72" rx="13" class="host"/>
  <text x="175" y="115" text-anchor="middle" class="title">User or CI job</text>
  <text x="175" y="139" text-anchor="middle" class="subtitle">profile · task · uploads</text>
  <rect x="50" y="215" width="250" height="105" rx="13" class="host"/>
  <text x="175" y="248" text-anchor="middle" class="title">OAR</text>
  <text x="175" y="273" text-anchor="middle" class="subtitle">launch one agent task</text>
  <text x="175" y="296" text-anchor="middle" class="subtitle">publish · clean up</text>
  <rect x="50" y="378" width="250" height="72" rx="13" class="artifact"/>
  <text x="175" y="408" text-anchor="middle" class="title">Host result</text>
  <text x="175" y="432" text-anchor="middle" class="subtitle">plain text or validated JSON</text>

  <rect x="390" y="25" width="710" height="470" rx="20" class="group"/>
  <text x="415" y="57" class="heading">OPENSHELL</text>
  <rect x="425" y="85" width="250" height="72" rx="13" class="open"/>
  <text x="550" y="115" text-anchor="middle" class="title">Gateway</text>
  <text x="550" y="139" text-anchor="middle" class="subtitle">provision · policy · inference</text>
  <rect x="740" y="85" width="325" height="340" rx="18" class="open"/>
  <text x="902" y="119" text-anchor="middle" class="title">Ephemeral sandbox</text>
  <rect x="775" y="150" width="255" height="64" rx="12" class="agent"/>
  <text x="902" y="178" text-anchor="middle" class="title">Single-task Pi agent</text>
  <text x="902" y="199" text-anchor="middle" class="subtitle">profile-defined behavior</text>
  <rect x="775" y="246" width="255" height="64" rx="12" class="agent"/>
  <text x="902" y="274" text-anchor="middle" class="title">Uploads</text>
  <text x="902" y="295" text-anchor="middle" class="subtitle">workspace · runtime resources</text>
  <rect x="775" y="342" width="255" height="55" rx="12" class="artifact"/>
  <text x="902" y="376" text-anchor="middle" class="title">Result artifact</text>

  <path d="M175 157v58" class="arrow"/>
  <path d="M300 267h80c25 0 45-20 45-45v-65" class="arrow"/>
  <text x="354" y="250" text-anchor="middle" class="label">native CLI</text>
  <path d="M675 121h65" class="arrow"/>
  <text x="708" y="108" text-anchor="middle" class="label">create</text>
  <path d="M902 214v32" class="arrow"/>
  <path d="M902 310v32" class="arrow"/>
  <path d="M775 369H700c-25 0-45 20-45 45H300" class="arrow"/>
  <text x="530" y="434" text-anchor="middle" class="label">download</text>
  <path d="M175 320v58" class="arrow"/>
</svg>
