<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Policy proving used less than 0.3 percent of AI inference time</title>
  <desc id="desc">Across ten successful GPT-5.6 Terra missions, two policy checks accounted for 0.05 to 0.26 percent of the time used to generate the initial and corrected plans. The median share was 0.16 percent.</desc>
  <style>
    .bg { fill: #f7f8fa; }
    .panel { fill: #fff; stroke: #d0d5dd; stroke-width: 1.5; }
    .title { font: 700 25px Inter, system-ui, sans-serif; fill: #101828; }
    .subtitle { font: 15px Inter, system-ui, sans-serif; fill: #475467; }
    .heading { font: 700 17px Inter, system-ui, sans-serif; fill: #101828; }
    .metric { font: 700 24px Inter, system-ui, sans-serif; fill: #101828; }
    .label { font: 13px Inter, system-ui, sans-serif; fill: #475467; }
    .value { font: 700 12px Inter, system-ui, sans-serif; fill: #344054; }
    .grid { stroke: #e4e7ec; stroke-width: 1; }
    .median { stroke: #667085; stroke-width: 2; stroke-dasharray: 6 5; }
    .policy { fill: #76b900; }
  </style>

  <rect class="bg" width="1200" height="620" rx="18"/>
  <text class="title" x="54" y="46">Policy proving used less than 0.3% of AI inference time</text>
  <text class="subtitle" x="54" y="74">Ten Terra missions · both the invalid initial plan and corrected plan were checked</text>

  <rect class="panel" x="48" y="98" width="346" height="112" rx="14"/>
  <text class="label" x="72" y="128">AI plan generation per mission</text>
  <text class="metric" x="72" y="166">7.53–16.90 s</text>
  <text class="label" x="72" y="190">initial plan + corrected plan</text>

  <rect class="panel" x="427" y="98" width="346" height="112" rx="14"/>
  <text class="label" x="451" y="128">Policy proving per mission</text>
  <text class="metric" x="451" y="166">5.76–26.23 ms</text>
  <text class="label" x="451" y="190">two deterministic checks</text>

  <rect class="panel" x="806" y="98" width="346" height="112" rx="14"/>
  <text class="label" x="830" y="128">Policy share of inference</text>
  <text class="metric" x="830" y="166">0.05–0.26%</text>
  <text class="label" x="830" y="190">median 0.16%</text>

  <rect class="panel" x="48" y="235" width="1104" height="333" rx="15"/>
  <text class="heading" x="76" y="269">Policy proving as a share of AI plan-generation time</text>
  <text class="label" x="1120" y="269" text-anchor="end">lower is less planning-loop overhead</text>

  <line class="grid" x1="160" y1="289" x2="160" y2="524"/>
  <line class="grid" x1="475" y1="289" x2="475" y2="524"/>
  <line class="grid" x1="790" y1="289" x2="790" y2="524"/>
  <line class="grid" x1="1105" y1="289" x2="1105" y2="524"/>
  <line class="median" x1="659.3" y1="289" x2="659.3" y2="524"/>
  <text class="label" x="667" y="305">median 0.16%</text>

  <g>
    <text class="label" x="82" y="329">Run 1</text><rect class="policy" x="160" y="317" width="277.7" height="13" rx="3"/><text class="value" x="446" y="329">0.09%</text>
    <text class="label" x="82" y="350">Run 2</text><rect class="policy" x="160" y="338" width="741.0" height="13" rx="3"/><text class="value" x="910" y="350">0.24%</text>
    <text class="label" x="82" y="371">Run 3</text><rect class="policy" x="160" y="359" width="637.6" height="13" rx="3"/><text class="value" x="806" y="371">0.20%</text>
    <text class="label" x="82" y="392">Run 4</text><rect class="policy" x="160" y="380" width="831.6" height="13" rx="3"/><text class="value" x="1000" y="392">0.26%</text>
    <text class="label" x="82" y="413">Run 5</text><rect class="policy" x="160" y="401" width="149.0" height="13" rx="3"/><text class="value" x="318" y="413">0.05%</text>
    <text class="label" x="82" y="434">Run 6</text><rect class="policy" x="160" y="422" width="166.3" height="13" rx="3"/><text class="value" x="335" y="434">0.05%</text>
    <text class="label" x="82" y="455">Run 7</text><rect class="policy" x="160" y="443" width="789.4" height="13" rx="3"/><text class="value" x="958" y="455">0.25%</text>
    <text class="label" x="82" y="476">Run 8</text><rect class="policy" x="160" y="464" width="173.6" height="13" rx="3"/><text class="value" x="342" y="476">0.06%</text>
    <text class="label" x="82" y="497">Run 9</text><rect class="policy" x="160" y="485" width="647.2" height="13" rx="3"/><text class="value" x="816" y="497">0.21%</text>
    <text class="label" x="76" y="518">Run 10</text><rect class="policy" x="160" y="506" width="360.8" height="13" rx="3"/><text class="value" x="529" y="518">0.11%</text>
  </g>

  <text class="label" x="160" y="548" text-anchor="middle">0%</text>
  <text class="label" x="475" y="548" text-anchor="middle">0.10%</text>
  <text class="label" x="790" y="548" text-anchor="middle">0.20%</text>
  <text class="label" x="1105" y="548" text-anchor="middle">0.30%</text>
  <text class="label" x="54" y="598">All 10 missions completed deny → replan → constrain → execute with no fixture fallback.</text>
</svg>
