<svg xmlns="http://www.w3.org/2000/svg" viewBox="350 220 1060 420" width="1060" height="420" role="img" aria-labelledby="oar-title oar-description">
  <title id="oar-title">OAR — OpenShell Agent Runner</title>
  <desc id="oar-description">An oar forms the left stroke of the A, with a terminal prompt cut out of its blade and two water ripples. NVIDIA green accents remain constant; lettering adapts to light and dark color schemes.</desc>
  <style>
    .lettering { fill: #1e1e1e; }
    .accent { fill: #76b900; }
    @media (prefers-color-scheme: dark) {
      .lettering { fill: #f5f5f5; }
    }
    /* Optional override when this SVG is embedded inline. */
    svg[data-theme="light"] .lettering { fill: #1e1e1e; }
    svg[data-theme="dark"] .lettering { fill: #f5f5f5; }
  </style>
  <g class="lettering" fill="#1e1e1e">
