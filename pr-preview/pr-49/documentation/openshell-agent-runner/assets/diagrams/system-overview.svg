<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="title description">
  <title id="title">From input to result</title>
  <desc id="description">Pass a profile and input to OAR. OAR runs the agent in an OpenShell sandbox, saves the result on your machine, and removes the sandbox.</desc>
  <defs>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#24352c}
      .box{fill:#f6f8f7;stroke:#b9c8bf;stroke-width:1.5}
      .accent{fill:#edf6dc;stroke:#76a938;stroke-width:1.5}
      .title{font-size:22px;font-weight:650}
      .note{font-size:16px;fill:#53665a}
      .arrow{fill:none;stroke:#73877b;stroke-width:2;marker-end:url(#arrow)}
      @media(prefers-color-scheme:dark){text{fill:#edf3ee}.box{fill:#202c25;stroke:#64786c}.accent{fill:#2b3c1e;stroke:#8fba53}.note{fill:#c2cec5}}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#73877b"/>
    </marker>
  </defs>
  <rect x="25" y="25" width="250" height="95" rx="12" class="box"/>
  <text x="150" y="65" text-anchor="middle" class="title">Profile + input</text>
  <text x="150" y="93" text-anchor="middle" class="note">Your instructions and files</text>
  <path d="M275 72H363" class="arrow"/>
  <rect x="365" y="25" width="250" height="95" rx="12" class="accent"/>
  <text x="490" y="65" text-anchor="middle" class="title">OAR</text>
  <text x="490" y="93" text-anchor="middle" class="note">One command, one task</text>
  <path d="M490 120V192" class="arrow"/>
  <text x="478" y="163" text-anchor="end" class="note">Create and run</text>
  <rect x="365" y="195" width="250" height="110" rx="12" class="box"/>
  <text x="490" y="231" text-anchor="middle" class="title">OpenShell sandbox</text>
  <text x="490" y="259" text-anchor="middle" class="note">Agent runs one task</text>
  <text x="490" y="283" text-anchor="middle" class="note">Removed after the run</text>
  <path d="M365 250H277" class="arrow"/>
  <text x="320" y="235" text-anchor="middle" class="note">Save</text>
  <rect x="25" y="195" width="250" height="110" rx="12" class="accent"/>
  <text x="150" y="236" text-anchor="middle" class="title">Result file</text>
  <text x="150" y="265" text-anchor="middle" class="note">Saved to your output path</text>
</svg>
