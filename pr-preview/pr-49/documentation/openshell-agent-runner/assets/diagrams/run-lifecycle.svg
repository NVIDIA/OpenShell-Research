<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-labelledby="title description">
  <title id="title">What OAR does for one run</title>
  <desc id="description">Check the request, create a sandbox and upload files, run the agent, validate and save the result, then remove the sandbox. Cleanup also runs after failures.</desc>
  <defs>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#24352c}
      .box{fill:#f6f8f7;stroke:#b9c8bf;stroke-width:1.5}
      .accent{fill:#edf6dc;stroke:#76a938;stroke-width:1.5}
      .title{font-size:22px;font-weight:650}
      .note{font-size:16px;fill:#53665a}
      .arrow{fill:none;stroke:#73877b;stroke-width:2;marker-end:url(#arrow)}
      @media(prefers-color-scheme:dark){text{fill:#edf3ee}.box{fill:#202c25;stroke:#64786c}.accent{fill:#2b3c1e;stroke:#8fba53}.note{fill:#c2cec5}}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#73877b"/>
    </marker>
  </defs>
  <path d="M300 78V103M300 160V185M300 242V267M300 324V349" class="arrow"/>
  <rect x="45" y="22" width="510" height="56" rx="10" class="box"/>
  <text x="70" y="58" class="title">1. Check the profile and input</text>
  <rect x="45" y="104" width="510" height="56" rx="10" class="box"/>
  <text x="70" y="140" class="title">2. Create a sandbox and upload files</text>
  <rect x="45" y="186" width="510" height="56" rx="10" class="accent"/>
  <text x="70" y="222" class="title">3. Run the agent</text>
  <rect x="45" y="268" width="510" height="56" rx="10" class="box"/>
  <text x="70" y="304" class="title">4. Check and save the result</text>
  <rect x="45" y="350" width="510" height="56" rx="10" class="box"/>
  <text x="70" y="386" class="title">5. Remove the sandbox</text>
  <text x="300" y="429" text-anchor="middle" class="note">Cleanup also runs after failures.</text>
</svg>
