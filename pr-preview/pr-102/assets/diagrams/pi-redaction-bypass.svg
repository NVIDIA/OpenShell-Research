<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" viewBox="0 0 1320 520" role="img" aria-labelledby="title description">
  <title id="title">Email redaction on tool results</title>
  <desc id="description">A dashed harness boundary encloses session history and tool results. The network filter and model context are outside that boundary. In a network-redacted session, Pi saves the original email in session history. A tool can print that email directly or encode it as character codes. On outgoing model requests, the filter replaces the plain email with EMAIL but misses the character codes. The model receives those codes and reconstructs the original email. These are two ways to read the same saved message. Character codes are abbreviated for display.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #f3f0e7;
      --surface: #fffefb;
      --user: #2454aa;
      --user-bg: #edf3ff;
      --assistant: #7441a5;
      --assistant-bg: #f7f1fd;
      --call: #8a5200;
      --call-bg: #fff5df;
      --result: #12655b;
      --result-bg: #eaf6f1;
      --ink: #202625;
      --muted: #666d6b;
      --rule: #ccc8bf;
      --line: #85847d;
      --orange: var(--call);
      --orange-fill: var(--call-bg);
      --error: #a42e40;
      --error-fill: #fff0f1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #121719;
        --surface: #192024;
        --user: #a3c1ff;
        --user-bg: #202e49;
        --assistant: #d0aff1;
        --assistant-bg: #2c2538;
        --call: #f0c278;
        --call-bg: #342e22;
        --result: #8dd8c6;
        --result-bg: #1d332e;
        --ink: #e6e8e2;
        --muted: #a7b1ad;
        --rule: #4b5352;
        --line: #a0a5a0;
        --orange: var(--call);
        --orange-fill: var(--call-bg);
        --error: #ffa1b0;
        --error-fill: #402530;
      }
    }
    text { font-family: Inter, system-ui, sans-serif; fill: var(--ink); }
    .eyebrow { font-size: 12px; font-weight: 650; letter-spacing: 1.6px; fill: var(--orange); }
    .stage { font-size: 19px; font-weight: 650; }
    .number { font-size: 13px; font-weight: 650; fill: var(--muted); text-anchor: middle; }
    .small { font-size: 14px; fill: var(--muted); }
    .label { font-size: 15px; font-weight: 650; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 16px; }
    .orange { fill: var(--orange); }
    .center { text-anchor: middle; }
    .action { font-size: 14px; font-weight: 600; text-anchor: middle; }
    .card { fill: var(--surface); stroke: var(--rule); stroke-width: 1.5; }
    .user-card { fill: var(--user-bg); stroke: var(--user); }
    .result-card { fill: var(--result-bg); stroke: var(--result); }
    .assistant-card { fill: var(--assistant-bg); stroke: var(--assistant); }
    .user-label { fill: var(--user); }
    .result-label { fill: var(--result); }
    .assistant-label { fill: var(--assistant); }
    .action { fill: var(--call); }
    .flow { fill: none; stroke: var(--line); stroke-width: 2; marker-end: url(#arrow); }
    .tool-flow { stroke: var(--call); marker-end: url(#filterArrow); }
    .filter-flow { stroke: var(--orange); marker-end: url(#filterArrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="var(--line)"/>
    </marker>
    <marker id="filterArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="var(--orange)"/>
    </marker>
  </defs>

  <rect width="1320" height="520" fill="var(--paper)"/>
  <text class="eyebrow" x="32" y="30">NETWORK REDACTION</text>
  <g transform="translate(0 -72)">
  <rect id="harnessBoundary" x="16" y="126" width="798" height="438" rx="16" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="7 6"/>
  <rect x="28" y="553" width="166" height="24" fill="var(--paper)"/>
  <text class="label" x="36" y="570" style="fill: var(--muted)">Harness boundary</text>

  <circle cx="46" cy="157" r="13" fill="none" stroke="var(--rule)"/>
  <text class="number" x="46" y="162">1</text>
  <text class="stage" x="70" y="163">Session history</text>

  <g transform="translate(120 0)">
  <circle cx="414" cy="157" r="13" fill="none" stroke="var(--rule)"/>
  <text class="number" x="414" y="162">2</text>
  <text class="stage" x="438" y="163">Tool result</text>

  <circle cx="882" cy="157" r="13" fill="none" stroke="var(--rule)"/>
  <text class="number" x="882" y="162">3</text>
  <text class="stage" x="906" y="163">Model context</text>

  </g>

  <!-- The history stays unchanged while tools choose how to present it. -->
  <rect class="card user-card" x="32" y="307" width="274" height="126" rx="12"/>
  <text class="label user-label" x="52" y="335">Original user message</text>
  <text class="mono" x="52" y="365">csagan34@palebluedot.edu</text>
  <path d="M52 383H286" stroke="var(--rule)"/>
  <text class="small" x="52" y="408">Still readable by the agent’s tools</text>

  <path d="M306 370H344" fill="none" stroke="var(--line)" stroke-width="2"/>
  <circle cx="344" cy="370" r="4" fill="var(--line)"/>
  <path class="flow tool-flow" d="M344 370V281H518"/>
  <text class="action" x="431" y="249">Tool reads</text>
  <text class="action" x="431" y="269">and prints</text>
  <path class="flow tool-flow" d="M344 370V463H518"/>
  <text class="action" x="431" y="431">Tool reads</text>
  <text class="action" x="431" y="451">and encodes</text>

  <g transform="translate(120 0)">
  <rect class="card result-card" x="400" y="237" width="274" height="88" rx="12"/>
  <text class="label result-label" x="420" y="266">Plain-text email</text>
  <text class="mono" x="420" y="302">csagan34@palebluedot.edu</text>

  <rect class="card result-card" x="400" y="419" width="274" height="88" rx="12"/>
  <text class="label result-label" x="420" y="448">Encoded email</text>
  <text class="mono" x="420" y="484">99 115 97 103 97 110 …</text>

  <!-- A filter acts on outgoing requests, not on the saved original. -->
  <text class="label orange center" x="771" y="213">Network filter</text>
  <path d="M771 227V560" stroke="var(--orange)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.55"/>
  <path class="flow filter-flow" d="M674 281H866"/>
  <circle cx="771" cy="281" r="6" fill="var(--orange)"/>
  <rect x="706" y="299" width="130" height="24" rx="4" fill="var(--paper)"/>
  <text class="small orange center" x="771" y="316">Email matched</text>

  <path class="flow" d="M674 463H866"/>
  <circle cx="771" cy="463" r="6" fill="var(--paper)" stroke="var(--orange)" stroke-width="2"/>
  <rect x="720" y="481" width="102" height="24" rx="4" fill="var(--paper)"/>
  <text class="small orange center" x="771" y="498">No match</text>

  <rect x="868" y="225" width="300" height="112" rx="12" fill="var(--orange-fill)" stroke="var(--orange)" stroke-width="1.5"/>
  <text class="label orange" x="888" y="254">Email redacted</text>
  <text class="mono" x="888" y="291" style="font-size: 23px">[EMAIL]</text>
  <text class="small" x="888" y="316">The original stays in history</text>

  <rect class="card assistant-card" x="868" y="393" width="300" height="178" rx="12"/>
  <text class="label assistant-label" x="888" y="422">Codes reach the model</text>
  <text class="mono" x="888" y="452">99 115 97 103 97 110 …</text>
  <path class="flow" d="M901 466V493"/>
  <text class="small" x="919" y="486">Model decodes</text>
  <text class="mono" x="888" y="517">csagan34@palebluedot.edu</text>
  <rect x="888" y="531" width="132" height="28" rx="14" fill="var(--error-fill)" stroke="var(--error)" stroke-width="1.5"/>
  <text class="label center" x="954" y="550" style="fill: var(--error)">✕ Email leaked</text>

  </g>

  </g>
</svg>
